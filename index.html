<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#111111" id="themeColorMeta">
<title>ANT-BOT Control v1.0.6</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

<style>
:root {
  /* Surface & Base (Dark Tone Default) */
  --bg-main: #111111;
  --text-main: #eeeeee;
  --text-muted: #8e8e93;
  --card-bg: #1c1c1e;
  --card-border: rgba(255, 255, 255, 0.12);
  --surface-elevated: rgba(255, 255, 255, 0.08);
  --surface-elevated-hover: rgba(255, 255, 255, 0.16);
  --surface-elevated-active: rgba(255, 255, 255, 0.22);
  --overlay-bg: rgba(0, 0, 0, 0.65);
  --joy-bg: rgba(255, 255, 255, 0.035);
  --joy-border: rgba(255, 255, 255, 0.12);
  --joy-label: rgba(255, 255, 255, 0.3);
  --knob-bg: rgba(255, 255, 255, 0.28);
  --knob-border: rgba(255, 255, 255, 0.5);
  --slider-track: rgba(255, 255, 255, 0.18);
  --slider-thumb-bg: #ffffff;
  --secondary-btn-bg: #2c2c2e;
  --secondary-btn-text: #eeeeee;
  --popover-bg: rgba(26, 26, 30, 0.96);
  --shadow-modal: 0 20px 40px rgba(0, 0, 0, 0.7);
  --scrollbar-thumb: rgba(255, 255, 255, 0.25);

  /* Accent - Cyber Blue (Default) */
  --accent: #2f80ff;
  --accent-hover: #1b6ef0;
  --accent-glow: rgba(47, 128, 255, 0.5);
  --accent-badge-bg: rgba(47, 128, 255, 0.2);
  --accent-badge-text: #4da3ff;
  --accent-badge-border: rgba(47, 128, 255, 0.4);
}

/* Light Tone */
[data-tone="light"] {
  --bg-main: #f2f3f7;
  --text-main: #18191c;
  --text-muted: #6b7280;
  --card-bg: #ffffff;
  --card-border: rgba(0, 0, 0, 0.1);
  --surface-elevated: rgba(0, 0, 0, 0.05);
  --surface-elevated-hover: rgba(0, 0, 0, 0.08);
  --surface-elevated-active: rgba(0, 0, 0, 0.12);
  --overlay-bg: rgba(0, 0, 0, 0.45);
  --joy-bg: rgba(0, 0, 0, 0.04);
  --joy-border: rgba(0, 0, 0, 0.12);
  --joy-label: rgba(0, 0, 0, 0.45);
  --knob-bg: rgba(0, 0, 0, 0.22);
  --knob-border: rgba(0, 0, 0, 0.35);
  --slider-track: rgba(0, 0, 0, 0.12);
  --slider-thumb-bg: #ffffff;
  --secondary-btn-bg: #e5e7eb;
  --secondary-btn-text: #1f2937;
  --popover-bg: rgba(255, 255, 255, 0.98);
  --shadow-modal: 0 16px 36px rgba(0, 0, 0, 0.18);
  --scrollbar-thumb: rgba(0, 0, 0, 0.2);

  --accent-badge-bg: rgba(47, 128, 255, 0.12);
  --accent-badge-text: #1d4ed8;
  --accent-badge-border: rgba(47, 128, 255, 0.28);
}

/* Color Themes */
[data-theme="green"] {
  --accent: #10b981;
  --accent-hover: #059669;
  --accent-glow: rgba(16, 185, 129, 0.5);
  --accent-badge-bg: rgba(16, 185, 129, 0.2);
  --accent-badge-text: #34d399;
  --accent-badge-border: rgba(16, 185, 129, 0.4);
}
[data-tone="light"][data-theme="green"] {
  --accent-badge-bg: rgba(16, 185, 129, 0.12);
  --accent-badge-text: #047857;
  --accent-badge-border: rgba(16, 185, 129, 0.28);
}

[data-theme="purple"] {
  --accent: #a855f7;
  --accent-hover: #9333ea;
  --accent-glow: rgba(168, 85, 247, 0.5);
  --accent-badge-bg: rgba(168, 85, 247, 0.2);
  --accent-badge-text: #c084fc;
  --accent-badge-border: rgba(168, 85, 247, 0.4);
}
[data-tone="light"][data-theme="purple"] {
  --accent-badge-bg: rgba(168, 85, 247, 0.12);
  --accent-badge-text: #7e22ce;
  --accent-badge-border: rgba(168, 85, 247, 0.28);
}

[data-theme="amber"] {
  --accent: #f59e0b;
  --accent-hover: #d97706;
  --accent-glow: rgba(245, 158, 11, 0.5);
  --accent-badge-bg: rgba(245, 158, 11, 0.2);
  --accent-badge-text: #fbbf24;
  --accent-badge-border: rgba(245, 158, 11, 0.4);
}
[data-tone="light"][data-theme="amber"] {
  --accent-badge-bg: rgba(245, 158, 11, 0.12);
  --accent-badge-text: #b45309;
  --accent-badge-border: rgba(245, 158, 11, 0.28);
}

[data-theme="crimson"] {
  --accent: #ef4444;
  --accent-hover: #dc2626;
  --accent-glow: rgba(239, 68, 68, 0.5);
  --accent-badge-bg: rgba(239, 68, 68, 0.2);
  --accent-badge-text: #f87171;
  --accent-badge-border: rgba(239, 68, 68, 0.4);
}
[data-tone="light"][data-theme="crimson"] {
  --accent-badge-bg: rgba(239, 68, 68, 0.12);
  --accent-badge-text: #b91c1c;
  --accent-badge-border: rgba(239, 68, 68, 0.28);
}

[data-theme="cyan"] {
  --accent: #06b6d4;
  --accent-hover: #0891b2;
  --accent-glow: rgba(6, 182, 212, 0.5);
  --accent-badge-bg: rgba(6, 182, 212, 0.2);
  --accent-badge-text: #22d3ee;
  --accent-badge-border: rgba(6, 182, 212, 0.4);
}
[data-tone="light"][data-theme="cyan"] {
  --accent-badge-bg: rgba(6, 182, 212, 0.12);
  --accent-badge-text: #0e7490;
  --accent-badge-border: rgba(6, 182, 212, 0.28);
}

*, *::before, *::after {
  box-sizing: border-box;
  -webkit-user-select: none;
  -moz-user-select: none;
  -ms-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
}

::selection {
  background: transparent;
}

input[type="text"], input[type="number"], textarea {
  -webkit-user-select: text;
  user-select: text;
}

body {
  margin: 0;
  background: var(--bg-main);
  color: var(--text-main);
  font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
  overflow: hidden;
  overscroll-behavior: none;
  touch-action: none;
  -webkit-user-select: none;
  -moz-user-select: none;
  -ms-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
  transition: background-color 0.25s ease, color 0.25s ease;
}

/* ===== CAMERA ===== */
#cameraBG {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: none;
  z-index: 0;
}

/* ===== TOP BAR ===== */
#top {
  padding: 12px;
  text-align: center;
  position: relative;
  z-index: 10;
}

#menuBtn, #fullscreenBtn {
  position: absolute;
  top: 8px;
  width: 44px;
  height: 44px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--surface-elevated);
  border: 1px solid var(--accent-badge-border);
  border-radius: 12px;
  color: var(--accent);
  font-size: 20px;
  cursor: pointer;
  touch-action: manipulation;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
  transition: all 0.2s ease;
  box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
  z-index: 20;
}

#menuBtn svg, #fullscreenBtn svg {
  pointer-events: none;
  display: block;
}

#menuBtn:active, #fullscreenBtn:active {
  background: var(--accent);
  color: #ffffff;
  border-color: var(--accent);
  transform: scale(0.92);
  box-shadow: 0 0 12px var(--accent-glow);
}

#menuBtn { left: 12px; }
#fullscreenBtn { right: 12px; }

#statusContainer {
  position: relative;
  display: inline-block;
  vertical-align: middle;
}

.ble-pill {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  background: var(--surface-elevated);
  border: 1px solid var(--card-border);
  border-radius: 20px;
  padding: 5px 12px 5px 10px;
  color: var(--text-main);
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  touch-action: manipulation;
  user-select: none;
  -webkit-user-select: none;
  -webkit-tap-highlight-color: transparent;
  transition: all 0.2s ease;
  box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
}

.ble-pill:active {
  transform: scale(0.96);
}

.ble-pill .pill-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  display: inline-block;
  flex-shrink: 0;
}

.ble-pill .pill-icon {
  display: block;
  flex-shrink: 0;
}

/* Disconnected State */
.ble-pill.disconnected {
  border-color: rgba(255, 92, 92, 0.35);
  background: rgba(255, 92, 92, 0.1);
}
.ble-pill.disconnected .pill-dot {
  background: #ff5c5c;
  box-shadow: 0 0 6px rgba(255, 92, 92, 0.7);
}
.ble-pill.disconnected .pill-icon {
  stroke: #ff5c5c;
}
.ble-pill.disconnected #blePillText {
  color: #ff8585;
}
.ble-pill.disconnected:hover {
  background: rgba(255, 92, 92, 0.18);
  border-color: rgba(255, 92, 92, 0.55);
}

[data-tone="light"] .ble-pill.disconnected {
  border-color: rgba(220, 38, 38, 0.35);
  background: rgba(220, 38, 38, 0.08);
}
[data-tone="light"] .ble-pill.disconnected #blePillText {
  color: #dc2626;
}

/* Connected State */
.ble-pill.connected {
  border-color: rgba(76, 255, 136, 0.4);
  background: rgba(76, 255, 136, 0.1);
}
.ble-pill.connected .pill-dot {
  background: #4cff88;
  box-shadow: 0 0 8px rgba(76, 255, 136, 0.85);
  animation: pulse-dot 2s infinite ease-in-out;
}
.ble-pill.connected .pill-icon {
  stroke: #4cff88;
}
.ble-pill.connected #blePillText {
  color: #79ffa8;
}
.ble-pill.connected:hover {
  background: rgba(76, 255, 136, 0.18);
  border-color: rgba(76, 255, 136, 0.6);
}

[data-tone="light"] .ble-pill.connected {
  border-color: rgba(5, 150, 105, 0.35);
  background: rgba(16, 185, 129, 0.1);
}
[data-tone="light"] .ble-pill.connected #blePillText {
  color: #059669;
}
[data-tone="light"] .ble-popover .popover-status {
  color: #059669;
}

@keyframes pulse-dot {
  0%, 100% { opacity: 1; transform: scale(1); }
  50% { opacity: 0.5; transform: scale(0.85); }
}

/* Connection Popover */
.ble-popover {
  position: absolute;
  top: calc(100% + 8px);
  left: 50%;
  transform: translateX(-50%);
  width: 220px;
  background: var(--popover-bg);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border: 1px solid var(--card-border);
  border-radius: 14px;
  padding: 12px;
  box-shadow: var(--shadow-modal);
  z-index: 100;
  text-align: left;
  transition: all 0.2s ease;
}

.ble-popover .popover-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 1px solid var(--card-border);
  padding-bottom: 8px;
  margin-bottom: 8px;
}
.ble-popover .popover-title {
  font-size: 13px;
  font-weight: 700;
  color: var(--text-main);
}
.ble-popover .popover-status {
  font-size: 11px;
  color: #4cff88;
  font-weight: 600;
}
.ble-popover .popover-info {
  font-size: 12px;
  color: var(--text-muted);
  margin-bottom: 10px;
}
.ble-popover .popover-actions {
  display: flex;
  gap: 6px;
}
.popover-btn {
  flex: 1;
  padding: 6px 10px;
  border-radius: 8px;
  border: none;
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
  touch-action: manipulation;
}
.popover-btn.danger {
  background: rgba(255, 71, 87, 0.2);
  color: #ff6b81;
  border: 1px solid rgba(255, 71, 87, 0.35);
}
.popover-btn.danger:active {
  background: #ff4757;
  color: #fff;
}
.popover-btn.secondary {
  background: var(--surface-elevated);
  color: var(--text-main);
  border: 1px solid var(--card-border);
}
.popover-btn.secondary:active {
  background: var(--surface-elevated-active);
}

#battery,
#telemetry,
.telemetry-display {
  margin-top: 6px;
  font-size: 15px;
  color: var(--text-muted);
}

.version-badge {
  display: inline-block;
  font-size: 11px;
  font-weight: 700;
  padding: 2px 7px;
  border-radius: 6px;
  background: var(--accent-badge-bg);
  color: var(--accent-badge-text);
  border: 1px solid var(--accent-badge-border);
  margin-left: 6px;
  vertical-align: middle;
  transition: all 0.2s ease;
}

/* ===== JOYSTICKS ===== */
.joy {
  position: fixed;
  bottom: 24px;
  width: 170px;
  height: 170px;
  border-radius: 50%;
  background: var(--joy-bg);
  border: 1px solid var(--joy-border);
  backdrop-filter: blur(2px);
  z-index: 10;
  user-select: none;
  touch-action: none;
  transition: background-color 0.25s ease, border-color 0.25s ease;
}

.joy-left {
  left: 20px;
}

.joy-right {
  right: 20px;
}

.joy-label {
  position: absolute;
  top: 14px;
  width: 100%;
  text-align: center;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 1.5px;
  color: var(--joy-label);
  pointer-events: none;
  transition: color 0.25s ease;
}

.knob {
  width: 70px;
  height: 70px;
  background: var(--knob-bg);
  border-radius: 50%;
  border: 1px solid var(--knob-border);
  position: absolute;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%);
  pointer-events: none;
  transition: background-color 0.25s ease, border-color 0.25s ease;
}

/* ===== OVERLAY ===== */
#overlay {
  position: fixed;
  inset: 0;
  background: var(--overlay-bg);
  display: none;
  z-index: 1000;
}

/* ===== SETTINGS MODAL ===== */
#settingsModal {
  position: fixed;
  top: 50%;
  left: 50%;
  width: 340px;
  max-width: 92vw;
  max-height: 86vh;
  max-height: calc(100dvh - 28px);
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  overscroll-behavior: contain;
  background: var(--card-bg);
  border: 1px solid var(--card-border);
  border-radius: 16px;
  padding: 16px 18px;
  transform: translate(-50%, -50%);
  display: none;
  z-index: 1001;
  box-shadow: var(--shadow-modal);
  color: var(--text-main);
  transition: background-color 0.25s ease, border-color 0.25s ease;
}

#settingsModal::-webkit-scrollbar {
  width: 5px;
}
#settingsModal::-webkit-scrollbar-thumb {
  background: var(--scrollbar-thumb);
  border-radius: 4px;
}

@media (max-height: 520px) {
  #settingsModal {
    max-height: calc(100dvh - 16px);
    padding: 12px 16px;
    width: 360px;
  }
  .settings-header {
    margin-bottom: 10px;
    font-size: 16px;
  }
  .settings-section {
    margin-bottom: 12px;
  }
  .toggle-row {
    padding: 5px 0;
    font-size: 14px;
  }
  .primary-btn, .secondary-btn, .danger-btn {
    padding: 8px;
  }
  .custom-slider {
    margin: 6px 12px 10px 12px;
    height: 28px;
  }
}

.settings-header {
  text-align: center;
  font-size: 18px;
  font-weight: 600;
  margin-bottom: 16px;
}

.settings-section { margin-bottom: 18px; }

.settings-section-title {
  font-size: 13px;
  color: var(--text-muted);
  margin-bottom: 8px;
  text-transform: uppercase;
}

.primary-btn {
  width: 100%;
  padding: 10px;
  border-radius: 10px;
  border: none;
  font-size: 15px;
  font-weight: 600;
  background: var(--accent);
  color: white;
  cursor: pointer;
  touch-action: manipulation;
  transition: background-color 0.2s ease;
}
.primary-btn:hover {
  background: var(--accent-hover);
}
.primary-btn:active {
  filter: brightness(0.9);
}

.secondary-btn {
  width: 100%;
  padding: 10px;
  border-radius: 10px;
  border: 1px solid var(--card-border);
  font-size: 14px;
  background: var(--secondary-btn-bg);
  color: var(--secondary-btn-text);
  cursor: pointer;
  touch-action: manipulation;
  transition: all 0.2s ease;
}
.secondary-btn:active {
  filter: brightness(0.9);
}

.danger-btn {
  width: 100%;
  padding: 10px;
  border-radius: 10px;
  border: none;
  font-size: 15px;
  font-weight: 600;
  background: #ff4757;
  color: white;
  cursor: pointer;
  touch-action: manipulation;
}
.danger-btn:active {
  background: #e84118;
}

.toggle-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 8px 0;
  font-size: 15px;
}

input[type="checkbox"] {
  accent-color: var(--accent);
  width: 18px;
  height: 18px;
  cursor: pointer;
}

/* Personalization Controls */
.personalization-label {
  font-size: 12px;
  color: var(--text-muted);
  margin-bottom: 6px;
  font-weight: 600;
}

.segmented-control {
  display: flex;
  background: var(--surface-elevated);
  border: 1px solid var(--card-border);
  border-radius: 10px;
  padding: 3px;
  gap: 4px;
}

.segment-btn {
  flex: 1;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  padding: 7px 10px;
  background: transparent;
  border: none;
  border-radius: 7px;
  font-size: 13px;
  font-weight: 600;
  color: var(--text-muted);
  cursor: pointer;
  transition: all 0.2s ease;
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
}

.segment-btn.active {
  background: var(--card-bg);
  color: var(--text-main);
  box-shadow: 0 2px 6px rgba(0, 0, 0, 0.2);
}

.color-swatches {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  padding: 4px 2px;
}

.swatch-btn {
  width: 32px;
  height: 32px;
  border-radius: 50%;
  border: 2px solid transparent;
  background: var(--swatch-color);
  cursor: pointer;
  position: relative;
  transition: transform 0.15s ease, box-shadow 0.15s ease;
  padding: 0;
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
  box-shadow: 0 2px 6px rgba(0, 0, 0, 0.25);
}

.swatch-btn:active {
  transform: scale(0.92);
}

.swatch-btn.active {
  border-color: var(--card-bg);
  box-shadow: 0 0 0 2.5px var(--swatch-color), 0 3px 8px rgba(0, 0, 0, 0.35);
  transform: scale(1.12);
}

.slider-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 14px;
  margin-top: 10px;
  margin-bottom: 2px;
}
.slider-header:first-of-type {
  margin-top: 2px;
}
.slider-val {
  color: var(--accent);
  font-weight: 600;
  font-size: 13px;
  font-variant-numeric: tabular-nums;
  transition: color 0.2s ease;
}

.custom-slider {
  position: relative;
  width: calc(100% - 24px);
  margin: 10px 12px 14px 12px;
  height: 32px;
  display: flex;
  align-items: center;
  touch-action: pan-y;
  cursor: default;
}

.custom-slider .slider-track {
  width: 100%;
  height: 6px;
  background: var(--slider-track);
  border-radius: 3px;
  position: relative;
  pointer-events: none;
}

.custom-slider .slider-fill {
  height: 100%;
  width: 0%;
  background: var(--accent);
  border-radius: 3px;
  pointer-events: none;
  transition: background-color 0.2s ease;
}

.custom-slider .slider-thumb {
  position: absolute;
  top: 50%;
  left: 0%;
  width: 24px;
  height: 24px;
  background: var(--slider-thumb-bg);
  border: 2px solid var(--accent);
  border-radius: 50%;
  transform: translate(-50%, -50%);
  cursor: grab;
  touch-action: none;
  box-shadow: 0 2px 8px rgba(0, 0, 0, 0.5);
  transition: transform 0.12s ease, box-shadow 0.12s ease, border-color 0.2s ease;
  user-select: none;
  -webkit-user-select: none;
}

.custom-slider .slider-thumb::before {
  content: "";
  position: absolute;
  top: -12px;
  bottom: -12px;
  left: -12px;
  right: -12px;
}

.custom-slider.dragging .slider-thumb,
.custom-slider .slider-thumb:active {
  cursor: grabbing;
  transform: translate(-50%, -50%) scale(1.18);
  box-shadow: 0 0 12px var(--accent-glow);
}

/* ===== IOS PSEUDO-FULLSCREEN & TOAST ===== */
body.is-fullscreen {
  position: fixed;
  inset: 0;
  width: 100vw;
  height: 100vh;
  height: 100dvh;
}

#toast {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%) translateY(30px);
  background: var(--popover-bg);
  color: var(--text-main);
  padding: 10px 18px;
  border-radius: 12px;
  border: 1px solid var(--card-border);
  box-shadow: var(--shadow-modal);
  font-size: 13px;
  font-weight: 500;
  pointer-events: none;
  opacity: 0;
  transition: opacity 0.25s ease, transform 0.25s ease;
  z-index: 1000;
  max-width: 90%;
  text-align: center;
}
#toast.show {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}
</style>

<script>
/* ================= VERSION & CACHE MANAGEMENT ================= */
const APP_VERSION = "1.0.6";
if (localStorage.getItem("app_version") !== APP_VERSION) {
  localStorage.setItem("app_version", APP_VERSION);
  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.getRegistrations().then(regs => {
      regs.forEach(r => r.unregister());
    });
  }
}

/* ================= BLE CONFIG ================= */
const SERVICE = "12345678-1234-1234-1234-1234567890ab";
const RX = "12345678-1234-1234-1234-1234567890ac";
const TX = "12345678-1234-1234-1234-1234567890ad";

let device, rxChar, txChar;
let rxBuffer = "";

/* ================= DOM ================= */
const overlay = document.getElementById("overlay");
const settingsModal = document.getElementById("settingsModal");
const blePill = document.getElementById("blePill");
const blePillText = document.getElementById("blePillText");
const blePopover = document.getElementById("blePopover");
const popoverDeviceName = document.getElementById("popoverDeviceName");
const popoverBattery = document.getElementById("popoverBattery");
const popoverTelemetry = popoverBattery;
const popoverDisconnectBtn = document.getElementById("popoverDisconnectBtn");
const popoverSettingsBtn = document.getElementById("popoverSettingsBtn");
const batteryEl = document.getElementById("battery");
const telemetryEl = batteryEl;
const cameraBG = document.getElementById("cameraBG");
const menuBtn = document.getElementById("menuBtn");
const fullscreenBtn = document.getElementById("fullscreenBtn");
const connectBtn = document.getElementById("connectBtn");
const disconnectBtn = document.getElementById("disconnectBtn");
const closeSettingsBtn = document.getElementById("closeSettingsBtn");
const speedVal = document.getElementById("speedVal");
const steeringGainVal = document.getElementById("steeringGainVal");
const invertSideway = document.getElementById("invertSideway");
const invertYaw = document.getElementById("invertYaw");
const invertForward = document.getElementById("invertForward");
const cameraToggle = document.getElementById("cameraToggle");

/* ================= CONTROL STATE ================= */
let forward = 0;       // forward/reverse (-1 to 1) from Right Joystick
let sideway = 0;       // strafe left/right (-1 to 1) from Right Joystick
let yaw = 0;           // steering / rotation (-1 to 1) from Left Joystick
let leftForward = 0;   // forward/reverse from Left Joystick when Right Joy is idle
let rightJoyActive = false;

/* ================= SETTINGS ================= */
const DEFAULT_SETTINGS = {
  maxSpeed: 1.0,      // 100%
  steeringGain: 1.0,  // 1.00x
  invertSideway: false,
  invertYaw: false,
  invertForward: false,
  cameraBG: false,
  tone: "dark",
  theme: "blue"
};

let savedSettings = {};
try {
  savedSettings = JSON.parse(localStorage.getItem("settings") || "{}");
} catch (_) {}

let appSettings = Object.assign({}, DEFAULT_SETTINGS, savedSettings);

// Ensure maxSpeed and steeringGain default to 1.0 (100% / 1.00x) if missing or invalid
if (typeof appSettings.maxSpeed !== "number" || isNaN(appSettings.maxSpeed)) {
  appSettings.maxSpeed = DEFAULT_SETTINGS.maxSpeed;
}
if (typeof appSettings.steeringGain !== "number" || isNaN(appSettings.steeringGain)) {
  appSettings.steeringGain = DEFAULT_SETTINGS.steeringGain;
}

function applyPersonalization() {
  const tone = appSettings.tone || "dark";
  const theme = appSettings.theme || "blue";

  document.documentElement.setAttribute("data-tone", tone);
  document.documentElement.setAttribute("data-theme", theme);

  const themeColorMeta = document.getElementById("themeColorMeta");
  if (themeColorMeta) {
    themeColorMeta.setAttribute("content", tone === "light" ? "#f2f3f7" : "#111111");
  }

  document.querySelectorAll("#toneControl .segment-btn").forEach(btn => {
    btn.classList.toggle("active", btn.dataset.toneVal === tone);
  });

  document.querySelectorAll("#themeSwatches .swatch-btn").forEach(btn => {
    btn.classList.toggle("active", btn.dataset.themeVal === theme);
  });
}

function updateSliderLabels() {
  if (speedVal) speedVal.textContent = Math.round(appSettings.maxSpeed * 100) + "%";
  if (steeringGainVal) steeringGainVal.textContent = (+appSettings.steeringGain).toFixed(2) + "x";
}

function saveSettings() {
  localStorage.setItem("settings", JSON.stringify(appSettings));
}

/* ================= DRAGGABLE SLIDER COMPONENT ================= */
function createCustomSlider(containerEl, { min, max, step, initialValue, onInput }) {
  const fill = containerEl.querySelector(".slider-fill");
  const thumb = containerEl.querySelector(".slider-thumb");
  let val = initialValue;
  let isDragging = false;

  function render(v) {
    const clamped = Math.max(min, Math.min(max, v));
    const pct = ((clamped - min) / (max - min)) * 100;
    thumb.style.left = `${pct}%`;
    fill.style.width = `${pct}%`;
  }

  function setValue(newVal, trigger = true) {
    val = Math.max(min, Math.min(max, newVal));
    render(val);
    if (trigger && onInput) onInput(val);
  }

  function updateFromPointer(clientX) {
    const rect = containerEl.getBoundingClientRect();
    if (rect.width <= 0) return;
    let ratio = (clientX - rect.left) / rect.width;
    ratio = Math.max(0, Math.min(1, ratio));
    let rawVal = min + ratio * (max - min);
    const steps = Math.round((rawVal - min) / step);
    let steppedVal = min + steps * step;
    steppedVal = +steppedVal.toFixed(4);
    steppedVal = Math.max(min, Math.min(max, steppedVal));
    setValue(steppedVal, true);
  }

  // ONLY dragging the thumb moves the slider (clicking the track does nothing)
  thumb.addEventListener("pointerdown", e => {
    isDragging = true;
    containerEl.classList.add("dragging");
    thumb.setPointerCapture(e.pointerId);
    e.stopPropagation();
    e.preventDefault();
  });

  thumb.addEventListener("pointermove", e => {
    if (!isDragging) return;
    updateFromPointer(e.clientX);
  });

  const onEnd = e => {
    if (isDragging) {
      isDragging = false;
      containerEl.classList.remove("dragging");
      try { thumb.releasePointerCapture(e.pointerId); } catch (_) {}
    }
  };
  thumb.addEventListener("pointerup", onEnd);
  thumb.addEventListener("pointercancel", onEnd);

  setValue(initialValue, false);

  return {
    get value() { return val; },
    set value(v) { setValue(v, false); }
  };
}

const speedSlider = createCustomSlider(document.getElementById("speedSlider"), {
  min: 0.2,
  max: 1.0,
  step: 0.05,
  initialValue: typeof appSettings.maxSpeed === "number" && !isNaN(appSettings.maxSpeed) ? appSettings.maxSpeed : DEFAULT_SETTINGS.maxSpeed,
  onInput: val => {
    appSettings.maxSpeed = val;
    updateSliderLabels();
    saveSettings();
  }
});

const steeringGainSlider = createCustomSlider(document.getElementById("steeringGainSlider"), {
  min: 0.1,
  max: 1.5,
  step: 0.05,
  initialValue: typeof appSettings.steeringGain === "number" && !isNaN(appSettings.steeringGain) ? appSettings.steeringGain : DEFAULT_SETTINGS.steeringGain,
  onInput: val => {
    appSettings.steeringGain = val;
    updateSliderLabels();
    saveSettings();
  }
});

invertSideway.checked = appSettings.invertSideway;
invertYaw.checked = appSettings.invertYaw;
invertForward.checked = appSettings.invertForward;
cameraToggle.checked = appSettings.cameraBG;
updateSliderLabels();

/* ================= SETTINGS EVENTS ================= */
invertSideway.onchange = e => { appSettings.invertSideway = e.target.checked; saveSettings(); };
invertYaw.onchange = e => { appSettings.invertYaw = e.target.checked; saveSettings(); };
invertForward.onchange = e => { appSettings.invertForward = e.target.checked; saveSettings(); };
cameraToggle.onchange = e => toggleCamera(e.target.checked);

const resetDefaultsBtn = document.getElementById("resetDefaultsBtn");
if (resetDefaultsBtn) {
  resetDefaultsBtn.addEventListener("click", () => {
    appSettings.maxSpeed = DEFAULT_SETTINGS.maxSpeed;
    appSettings.steeringGain = DEFAULT_SETTINGS.steeringGain;
    appSettings.invertSideway = DEFAULT_SETTINGS.invertSideway;
    appSettings.invertYaw = DEFAULT_SETTINGS.invertYaw;
    appSettings.invertForward = DEFAULT_SETTINGS.invertForward;

    speedSlider.value = appSettings.maxSpeed;
    steeringGainSlider.value = appSettings.steeringGain;
    invertSideway.checked = appSettings.invertSideway;
    invertYaw.checked = appSettings.invertYaw;
    invertForward.checked = appSettings.invertForward;

    updateSliderLabels();
    saveSettings();
    showToast("Driving controls reset to defaults (100% / 1.00x)");
  });
}

document.querySelectorAll("#toneControl .segment-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    appSettings.tone = btn.dataset.toneVal;
    saveSettings();
    applyPersonalization();
  });
});

document.querySelectorAll("#themeSwatches .swatch-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    appSettings.theme = btn.dataset.themeVal;
    saveSettings();
    applyPersonalization();
  });
});

// Apply saved personalization immediately on startup
applyPersonalization();

/* ================= SETTINGS MODAL ================= */
function openSettings() {
  overlay.style.display = "block";
  settingsModal.style.display = "block";
}
function closeSettings() {
  overlay.style.display = "none";
  settingsModal.style.display = "none";
}
menuBtn.onclick = openSettings;
closeSettingsBtn.onclick = overlay.onclick = closeSettings;

/* ================= CAMERA ================= */
let cameraStream = null;
async function toggleCamera(on) {
  appSettings.cameraBG = on;
  saveSettings();
  if (on) {
    cameraStream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: "environment" } }, audio: false
    });
    cameraBG.srcObject = cameraStream;
    cameraBG.style.display = "block";
  } else {
    cameraBG.style.display = "none";
    cameraStream?.getTracks().forEach(t => t.stop());
  }
}

/* ================= BLE CONNECT & DISCONNECT ================= */
function updateBleUi(connected) {
  if (connected) {
    blePill.className = "ble-pill connected";
    const devName = (device && device.name) ? device.name : "Connected";
    blePillText.textContent = devName;
    popoverDeviceName.textContent = devName;
    popoverBattery.textContent = batteryEl.textContent;
    connectBtn.style.display = "none";
    disconnectBtn.style.display = "block";
  } else {
    blePill.className = "ble-pill disconnected";
    blePillText.textContent = "Not connect";
    batteryEl.textContent = "Telemetry: --";
    popoverBattery.textContent = "Telemetry: --";
    blePopover.style.display = "none";
    connectBtn.style.display = "block";
    disconnectBtn.style.display = "none";
    rxChar = null;
    txChar = null;
    isWriting = false;
  }
}

function onDisconnected() {
  updateBleUi(false);
  showToast("BLE Disconnected");
}

async function startBleConnection() {
  try {
    device = await navigator.bluetooth.requestDevice({
      filters: [
        { namePrefix: "ANT-BOT" }
      ],
      optionalServices: [SERVICE]
    });

    device.addEventListener('gattserverdisconnected', onDisconnected);

    const server = await device.gatt.connect();
    const service = await server.getPrimaryService(SERVICE);

    rxChar = await service.getCharacteristic(RX);
    txChar = await service.getCharacteristic(TX);

    await txChar.startNotifications();
    txChar.addEventListener("characteristicvaluechanged", onNotify);

    updateBleUi(true);
    closeSettings();
    showToast("Connected to ANT-BOT");
  } catch (e) {
    updateBleUi(false);
    console.error(e);
  }
}

// Click on pill: if not connected, connect; if connected, show options popover
blePill.onclick = (e) => {
  e.stopPropagation();
  if (!rxChar) {
    startBleConnection();
  } else {
    const isShowing = blePopover.style.display === "block";
    blePopover.style.display = isShowing ? "none" : "block";
    if (!isShowing) {
      popoverBattery.textContent = batteryEl.textContent;
    }
  }
};

popoverDisconnectBtn.onclick = (e) => {
  e.stopPropagation();
  blePopover.style.display = "none";
  if (device && device.gatt && device.gatt.connected) {
    device.gatt.disconnect();
  } else {
    onDisconnected();
  }
};

popoverSettingsBtn.onclick = (e) => {
  e.stopPropagation();
  blePopover.style.display = "none";
  openSettings();
};

document.addEventListener("click", (e) => {
  if (blePopover.style.display === "block" && !blePopover.contains(e.target) && e.target !== blePill) {
    blePopover.style.display = "none";
  }
});

connectBtn.onclick = startBleConnection;

disconnectBtn.onclick = () => {
  if (device && device.gatt && device.gatt.connected) {
    device.gatt.disconnect();
  } else {
    onDisconnected();
  }
};

/* ================= BLE RX ================= */
function onNotify(e) {
  const data = new TextDecoder().decode(e.target.value);
  for (let idx = 0; idx < data.length; idx++) {
    const c = data[idx];
    if (c === "\n" || c === "\r") {
      if (rxBuffer.trim().length > 0) handleStatus(rxBuffer);
      rxBuffer = "";
    } else {
      rxBuffer += c;
    }
  }
}

/* ================= MOTOR LOOP ================= */
let isWriting = false;

setInterval(async () => {
  if (!rxChar || isWriting) return;

  const activeFwd = rightJoyActive ? forward : leftForward;
  const steerGain = appSettings.steeringGain !== undefined ? appSettings.steeringGain : 1.0;
  const x = Math.round(Math.min(100, Math.max(-100, sideway * appSettings.maxSpeed * 100)));
  const y = Math.round(Math.min(100, Math.max(-100, activeFwd * appSettings.maxSpeed * 100)));
  const z = Math.round(Math.min(100, Math.max(-100, yaw * appSettings.maxSpeed * steerGain * 100)));

  const packet = new TextEncoder().encode(`drive ${x},${y},${z}\n`);
  isWriting = true;
  try {
    if (rxChar.writeValueWithoutResponse) {
      await rxChar.writeValueWithoutResponse(packet);
    } else {
      await rxChar.writeValue(packet);
    }
  } catch (err) {
    console.warn("Write dropped/error:", err);
  } finally {
    isWriting = false;
  }
}, 35);

/* ================= TELEMETRY / STATUS PARSER ================= */
function formatTelemetryValue(key, rawVal) {
  const upperKey = key.toUpperCase();
  const num = Number(rawVal);
  const isNumeric = !isNaN(num) && rawVal.trim() !== "";

  if (isNumeric) {
    if (upperKey === "V" || upperKey === "VOLT" || upperKey === "VOLTAGE") {
      return `${key}: ${num.toFixed(2)} V`;
    }
    if (upperKey === "I" || upperKey === "CUR" || upperKey === "CURRENT") {
      return `${key}: ${num.toFixed(1)} mA`;
    }
    if (upperKey === "BAT" || upperKey === "BATT" || upperKey === "BATTERY" || upperKey === "SOC") {
      return `${key}: ${Math.round(num)}%`;
    }
    if (upperKey === "TEMP" || upperKey === "TEMPERATURE") {
      return `${key}: ${num.toFixed(1)}°C`;
    }
    if (upperKey === "RPM") {
      return `${key}: ${Math.round(num)} RPM`;
    }
    if (upperKey === "DIST" || upperKey === "DISTANCE") {
      return `${key}: ${num.toFixed(1)} cm`;
    }
    if (!Number.isInteger(num)) {
      return `${key}: ${num.toFixed(2)}`;
    }
  }

  return `${key}: ${rawVal}`;
}

function handleStatus(msg) {
  if (!msg || typeof msg !== "string") return;
  const raw = msg.trim();
  if (!raw) return;

  let displayText = "";

  // 1. JSON telemetry object
  if (raw.startsWith("{") && raw.endsWith("}")) {
    try {
      const obj = JSON.parse(raw);
      const parts = [];
      for (const [k, v] of Object.entries(obj)) {
        parts.push(formatTelemetryValue(k, String(v)));
      }
      if (parts.length > 0) displayText = parts.join(" | ");
    } catch (_) {}
  }

  // 2. Key-Value pairs (e.g. "status V=4.12 I=120.5", "temp=25 hum=60", "RPM: 1200")
  if (!displayText) {
    const clean = raw.replace(/^(status|telemetry|data|info)[:\s]+/i, "").trim();
    const kvRegex = /([a-zA-Z0-9_#$@.-]+)\s*[:=]\s*([^\s,;|]+)/g;
    const matches = [...clean.matchAll(kvRegex)];

    if (matches.length > 0) {
      displayText = matches.map(m => formatTelemetryValue(m[1], m[2])).join(" | ");
    } else {
      // 3. Fallback for arbitrary/plain telemetry text
      displayText = clean;
    }
  }

  if (displayText) {
    batteryEl.textContent = displayText;
    if (popoverBattery) popoverBattery.textContent = displayText;
  }
}

/* ================= RELATIVE JOYSTICK ================= */
function setupJoystick(el, onMove, onRelease, onStart) {
  const knob = el.querySelector(".knob");
  const r = el.clientWidth / 2;
  const kr = knob.clientWidth / 2;
  const maxDist = r - kr;

  let active = false, sx = 0, sy = 0;

  function update(dx, dy) {
    const d = Math.min(maxDist, Math.hypot(dx, dy));
    const a = Math.atan2(dy, dx);
    const px = Math.cos(a) * d;
    const py = Math.sin(a) * d;
    knob.style.transform = `translate(${px}px,${py}px) translate(-50%,-50%)`;
    onMove(px / maxDist, py / maxDist);
  }

  el.addEventListener("pointerdown", e => {
    el.setPointerCapture(e.pointerId);
    active = true;
    sx = e.clientX; sy = e.clientY;
    if (onStart) onStart();
    update(0, 0);
  });
  el.addEventListener("pointermove", e => { if (active) update(e.clientX - sx, e.clientY - sy); });
  const end = () => {
    active = false;
    knob.style.transform = "translate(-50%,-50%)";
    onRelease();
  };
  el.addEventListener("pointerup", end);
  el.addEventListener("pointercancel", end);
}

/* ================= FULLSCREEN ================= */
function isFullscreen() {
  return !!(
    document.fullscreenElement ||
    document.webkitFullscreenElement ||
    document.mozFullScreenElement ||
    document.msFullscreenElement ||
    document.body.classList.contains("is-fullscreen")
  );
}

function showToast(msg, duration = 3000) {
  const toast = document.getElementById("toast");
  if (!toast) return;
  toast.textContent = msg;
  toast.classList.add("show");
  clearTimeout(toast._timer);
  toast._timer = setTimeout(() => toast.classList.remove("show"), duration);
}

async function toggleFullscreen() {
  const doc = document.documentElement;
  const isFs = isFullscreen();

  if (!isFs) {
    let entered = false;

    // Standard Fullscreen API (Android Chrome, Edge, etc.)
    if (doc.requestFullscreen) {
      try {
        await doc.requestFullscreen({ navigationUI: "hide" });
        entered = true;
      } catch (err) {
        try {
          await doc.requestFullscreen();
          entered = true;
        } catch (err2) {
          console.warn("doc.requestFullscreen fallback failed:", err2);
        }
      }
    }

    // Body fallback
    if (!entered && document.body.requestFullscreen) {
      try {
        await document.body.requestFullscreen({ navigationUI: "hide" });
        entered = true;
      } catch (err) {
        try {
          await document.body.requestFullscreen();
          entered = true;
        } catch (err2) {}
      }
    }

    // WebKit prefix (iPadOS / Safari)
    if (!entered && doc.webkitRequestFullscreen) {
      try {
        doc.webkitRequestFullscreen();
        entered = true;
      } catch (err) {}
    }
    if (!entered && document.body.webkitRequestFullscreen) {
      try {
        document.body.webkitRequestFullscreen();
        entered = true;
      } catch (err) {}
    }

    // Orientation lock if available
    if (screen.orientation && screen.orientation.lock) {
      screen.orientation.lock("landscape").catch(() => {});
    }

    if (entered) {
      showToast("Fullscreen Active");
    } else {
      // iOS iPhone fallback where element Fullscreen API is disabled by Apple
      document.body.classList.add("is-fullscreen");
      window.scrollTo(0, 1);
      const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
      if (isIOS) {
        showToast("iOS: Tap Share > Add to Home Screen for borderless fullscreen", 4500);
      } else {
        showToast("Fullscreen Mode");
      }
    }
  } else {
    document.body.classList.remove("is-fullscreen");
    try {
      if (document.exitFullscreen) {
        await document.exitFullscreen();
      } else if (document.webkitExitFullscreen) {
        document.webkitExitFullscreen();
      }
    } catch (e) {}
    if (screen.orientation && screen.orientation.unlock) {
      screen.orientation.unlock().catch(() => {});
    }
    showToast("Exited Fullscreen");
  }
  updateFsIcon();
}

let lastFsToggle = 0;
function onFullscreenClick(e) {
  if (e && e.cancelable) e.preventDefault();
  const now = Date.now();
  if (now - lastFsToggle < 350) return;
  lastFsToggle = now;
  toggleFullscreen();
}

fullscreenBtn.addEventListener("click", onFullscreenClick);
fullscreenBtn.addEventListener("touchend", onFullscreenClick);

const FS_ICON_ENTER = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 3 21 3 21 9"/><polyline points="9 21 3 21 3 15"/><line x1="21" y1="3" x2="14" y2="10"/><line x1="3" y1="21" x2="10" y2="14"/></svg>';
const FS_ICON_EXIT  = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="4 14 10 14 10 20"/><polyline points="20 10 14 10 14 4"/><line x1="14" y1="10" x2="21" y2="3"/><line x1="10" y1="14" x2="3" y2="21"/></svg>';

function updateFsIcon() {
  fullscreenBtn.innerHTML = isFullscreen() ? FS_ICON_EXIT : FS_ICON_ENTER;
}
document.addEventListener("fullscreenchange", updateFsIcon);
document.addEventListener("webkitfullscreenchange", updateFsIcon);
updateFsIcon();

/* ================= INIT ================= */
// Left Joystick: Controls steering (Yaw) + Forward (when Right Joy is not touched)
setupJoystick(
  document.getElementById("joyYaw"),
  (nx, ny) => {
    yaw = appSettings.invertYaw ? -nx : nx;
    leftForward = appSettings.invertForward ? ny : -ny;
  },
  () => {
    yaw = 0;
    leftForward = 0;
  }
);

// Right Joystick: Controls Forward and Sideway (takes precedence when touched)
setupJoystick(
  document.getElementById("joyDrive"),
  (nx, ny) => {
    sideway = appSettings.invertSideway ? -nx : nx;
    forward = appSettings.invertForward ? ny : -ny;
  },
  () => {
    rightJoyActive = false;
    forward = 0;
    sideway = 0;
  },
  () => {
    rightJoyActive = true;
  }
);

if (appSettings.cameraBG) toggleCamera(true);

// Prevent accidental text selection and context menu callouts on mobile touch
document.addEventListener("selectstart", (e) => {
  if (e.target.tagName !== "INPUT" && e.target.tagName !== "TEXTAREA") {
    e.preventDefault();
  }
});
document.addEventListener("contextmenu", (e) => {
  if (e.target.tagName !== "INPUT" && e.target.tagName !== "TEXTAREA") {
    e.preventDefault();
  }
});
