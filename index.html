<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#111111">
<title>ANT-BOT Control v1.0.3</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

<style>
*, *::before, *::after {
  box-sizing: border-box;
  -webkit-user-select: none;
  -moz-user-select: none;
  -ms-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
}

::selection {
  background: transparent;
}

input[type="text"], input[type="number"], textarea {
  -webkit-user-select: text;
  user-select: text;
}

body {
  margin: 0;
  background: #111;
  color: #eee;
  font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
  overflow: hidden;
  overscroll-behavior: none;
  touch-action: none;
  -webkit-user-select: none;
  -moz-user-select: none;
  -ms-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
}

/* ===== CAMERA ===== */
#cameraBG {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: none;
  z-index: 0;
}

/* ===== TOP BAR ===== */
#top {
  padding: 12px;
  text-align: center;
  position: relative;
  z-index: 10;
}

#menuBtn, #fullscreenBtn {
  position: absolute;
  top: 8px;
  width: 44px;
  height: 44px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(255, 255, 255, 0.08);
  border: 1px solid rgba(255, 255, 255, 0.16);
  border-radius: 12px;
  color: #eee;
  font-size: 20px;
  cursor: pointer;
  touch-action: manipulation;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
  z-index: 20;
}

#menuBtn svg, #fullscreenBtn svg {
  pointer-events: none;
  display: block;
}

#menuBtn:active, #fullscreenBtn:active {
  background: rgba(255, 255, 255, 0.22);
  transform: scale(0.92);
}

#menuBtn { left: 12px; }
#fullscreenBtn { right: 12px; }

#statusRow {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
}

#status {
  font-size: 14px;
  font-weight: 600;
  transition: opacity 0.15s ease;
}
.status-connected {
  color: #4cff88;
  cursor: default;
}
.status-disconnected {
  color: #ff5c5c;
  cursor: pointer;
}
.status-disconnected:active {
  opacity: 0.75;
}

.quick-connect-btn {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  background: #2f80ff;
  color: #ffffff;
  border: 1px solid rgba(255, 255, 255, 0.2);
  border-radius: 8px;
  padding: 4px 10px;
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
  touch-action: manipulation;
  user-select: none;
  -webkit-user-select: none;
  -webkit-tap-highlight-color: transparent;
  box-shadow: 0 2px 8px rgba(47, 128, 255, 0.35);
  transition: background 0.15s ease, transform 0.1s ease;
}

.quick-connect-btn:active {
  background: #1a6be0;
  transform: scale(0.93);
}

.quick-connect-btn svg {
  display: block;
}

#battery {
  margin-top: 6px;
  font-size: 15px;
}

.version-badge {
  display: inline-block;
  font-size: 11px;
  font-weight: 700;
  padding: 2px 7px;
  border-radius: 6px;
  background: rgba(47, 128, 255, 0.2);
  color: #4da3ff;
  border: 1px solid rgba(47, 128, 255, 0.4);
  margin-left: 6px;
  vertical-align: middle;
}

/* ===== JOYSTICKS ===== */
.joy {
  position: fixed;
  bottom: 24px;
  width: 170px;
  height: 170px;
  border-radius: 50%;
  background: rgba(255,255,255,0.035);
  border: 1px solid rgba(255,255,255,0.12);
  backdrop-filter: blur(2px);
  z-index: 10;
  user-select: none;
  touch-action: none;
}

.joy-left {
  left: 20px;
}

.joy-right {
  right: 20px;
}

.joy-label {
  position: absolute;
  top: 14px;
  width: 100%;
  text-align: center;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 1.5px;
  color: rgba(255,255,255,0.3);
  pointer-events: none;
}

.knob {
  width: 70px;
  height: 70px;
  background: rgba(255,255,255,0.28);
  border-radius: 50%;
  border: 1px solid rgba(255,255,255,0.5);
  position: absolute;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%);
  pointer-events: none;
}

/* ===== OVERLAY ===== */
#overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.65);
  display: none;
  z-index: 1000;
}

/* ===== SETTINGS MODAL ===== */
#settingsModal {
  position: fixed;
  top: 50%;
  left: 50%;
  width: 340px;
  max-width: 92vw;
  max-height: 86vh;
  max-height: calc(100dvh - 28px);
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  overscroll-behavior: contain;
  background: #1c1c1e;
  border: 1px solid rgba(255, 255, 255, 0.12);
  border-radius: 16px;
  padding: 16px 18px;
  transform: translate(-50%, -50%);
  display: none;
  z-index: 1001;
  box-shadow: 0 20px 40px rgba(0,0,0,0.7);
}

#settingsModal::-webkit-scrollbar {
  width: 5px;
}
#settingsModal::-webkit-scrollbar-thumb {
  background: rgba(255, 255, 255, 0.25);
  border-radius: 4px;
}

@media (max-height: 520px) {
  #settingsModal {
    max-height: calc(100dvh - 16px);
    padding: 12px 16px;
    width: 360px;
  }
  .settings-header {
    margin-bottom: 10px;
    font-size: 16px;
  }
  .settings-section {
    margin-bottom: 12px;
  }
  .toggle-row {
    padding: 5px 0;
    font-size: 14px;
  }
  .primary-btn, .secondary-btn, .danger-btn {
    padding: 8px;
  }
  .custom-slider {
    margin: 6px 12px 10px 12px;
    height: 28px;
  }
}

.settings-header {
  text-align: center;
  font-size: 18px;
  font-weight: 600;
  margin-bottom: 16px;
}

.settings-section { margin-bottom: 18px; }

.settings-section-title {
  font-size: 13px;
  color: #aaa;
  margin-bottom: 8px;
  text-transform: uppercase;
}

.primary-btn {
  width: 100%;
  padding: 10px;
  border-radius: 10px;
  border: none;
  font-size: 15px;
  font-weight: 600;
  background: #2f80ff;
  color: white;
}

.secondary-btn {
  width: 100%;
  padding: 10px;
  border-radius: 10px;
  border: none;
  font-size: 14px;
  background: #333;
  color: #eee;
}

.danger-btn {
  width: 100%;
  padding: 10px;
  border-radius: 10px;
  border: none;
  font-size: 15px;
  font-weight: 600;
  background: #ff4757;
  color: white;
  cursor: pointer;
  touch-action: manipulation;
}
.danger-btn:active {
  background: #e84118;
}

.toggle-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 8px 0;
  font-size: 15px;
}

.slider-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 14px;
  margin-top: 10px;
  margin-bottom: 2px;
}
.slider-header:first-of-type {
  margin-top: 2px;
}
.slider-val {
  color: #2f80ff;
  font-weight: 600;
  font-size: 13px;
  font-variant-numeric: tabular-nums;
}

.custom-slider {
  position: relative;
  width: calc(100% - 24px);
  margin: 10px 12px 14px 12px;
  height: 32px;
  display: flex;
  align-items: center;
  touch-action: pan-y;
  cursor: default;
}

.custom-slider .slider-track {
  width: 100%;
  height: 6px;
  background: rgba(255, 255, 255, 0.18);
  border-radius: 3px;
  position: relative;
  pointer-events: none;
}

.custom-slider .slider-fill {
  height: 100%;
  width: 0%;
  background: #2f80ff;
  border-radius: 3px;
  pointer-events: none;
}

.custom-slider .slider-thumb {
  position: absolute;
  top: 50%;
  left: 0%;
  width: 24px;
  height: 24px;
  background: #ffffff;
  border: 2px solid #2f80ff;
  border-radius: 50%;
  transform: translate(-50%, -50%);
  cursor: grab;
  touch-action: none;
  box-shadow: 0 2px 8px rgba(0, 0, 0, 0.5);
  transition: transform 0.12s ease, box-shadow 0.12s ease;
  user-select: none;
  -webkit-user-select: none;
}

.custom-slider .slider-thumb::before {
  content: "";
  position: absolute;
  top: -12px;
  bottom: -12px;
  left: -12px;
  right: -12px;
}

.custom-slider.dragging .slider-thumb,
.custom-slider .slider-thumb:active {
  cursor: grabbing;
  transform: translate(-50%, -50%) scale(1.18);
  box-shadow: 0 0 12px rgba(47, 128, 255, 0.7);
}

/* ===== IOS PSEUDO-FULLSCREEN & TOAST ===== */
body.is-fullscreen {
  position: fixed;
  inset: 0;
  width: 100vw;
  height: 100vh;
  height: 100dvh;
}

#toast {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%) translateY(30px);
  background: rgba(22, 22, 26, 0.95);
  color: #fff;
  padding: 10px 18px;
  border-radius: 12px;
  border: 1px solid rgba(255, 255, 255, 0.18);
  box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
  font-size: 13px;
  font-weight: 500;
  pointer-events: none;
  opacity: 0;
  transition: opacity 0.25s ease, transform 0.25s ease;
  z-index: 1000;
  max-width: 90%;
  text-align: center;
}
#toast.show {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}
</style>
</head>

<body>

<video id="cameraBG" autoplay muted playsinline></video>
<div id="overlay"></div>

<!-- ===== SETTINGS ===== -->
<div id="settingsModal">
  <div class="settings-header">⚙ Settings <span class="version-badge">v1.0.3</span></div>

  <div class="settings-section">
    <button class="primary-btn" id="connectBtn">Connect to BLE</button>
    <button class="danger-btn" id="disconnectBtn" style="display: none;">Disconnect BLE</button>
  </div>

  <div class="settings-section">
    <div class="settings-section-title">Driving</div>
    <div class="slider-header">
      <span>Max Speed</span>
      <span class="slider-val" id="speedVal">100%</span>
    </div>
    <div class="custom-slider" id="speedSlider">
      <div class="slider-track"><div class="slider-fill"></div></div>
      <div class="slider-thumb"></div>
    </div>

    <div class="slider-header">
      <span>Steering Gain</span>
      <span class="slider-val" id="steeringGainVal">1.00x</span>
    </div>
    <div class="custom-slider" id="steeringGainSlider">
      <div class="slider-track"><div class="slider-fill"></div></div>
      <div class="slider-thumb"></div>
    </div>

    <div class="toggle-row">
      <span>Invert Sideway</span>
      <input id="invertSideway" type="checkbox">
    </div>

    <div class="toggle-row">
      <span>Invert Yaw (Steering)</span>
      <input id="invertYaw" type="checkbox">
    </div>

    <div class="toggle-row">
      <span>Invert Forward</span>
      <input id="invertForward" type="checkbox">
    </div>
  </div>

  <div class="settings-section">
    <div class="settings-section-title">View</div>
    <div class="toggle-row">
      <span>Camera Background</span>
      <input id="cameraToggle" type="checkbox">
    </div>
  </div>

  <button class="secondary-btn" id="closeSettingsBtn">Close</button>
</div>

<!-- ===== TOP BAR ===== -->
<div id="top">
  <button id="menuBtn">☰</button>
  <button id="fullscreenBtn" title="Toggle Fullscreen" aria-label="Toggle Fullscreen">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="15 3 21 3 21 9"></polyline>
      <polyline points="9 21 3 21 3 15"></polyline>
      <line x1="21" y1="3" x2="14" y2="10"></line>
      <line x1="3" y1="21" x2="10" y2="14"></line>
    </svg>
  </button>
  <div id="statusRow">
    <div id="status" class="status-disconnected" title="Click to Connect">Not connect <span class="version-badge">v1.0.3</span></div>
    <button id="quickConnectBtn" class="quick-connect-btn" title="Connect to BLE">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
        <path d="m7 7 10 10-5 5V2l5 5L7 17"/>
      </svg>
      <span>Connect</span>
    </button>
  </div>
  <div id="battery">V: --.- V | I: ---.- mA</div>
</div>

<!-- ===== JOYSTICKS ===== -->
<div class="joy joy-left" id="joyYaw">
  <div class="joy-label">STEER / DRIVE</div>
  <div class="knob"></div>
</div>

<div class="joy joy-right" id="joyDrive">
  <div class="joy-label">MOVE (FWD/SIDE)</div>
  <div class="knob"></div>
</div>

<div id="toast"></div>

<script>
/* ================= VERSION & CACHE MANAGEMENT ================= */
const APP_VERSION = "1.0.3";
if (localStorage.getItem("app_version") !== APP_VERSION) {
  localStorage.setItem("app_version", APP_VERSION);
  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.getRegistrations().then(regs => {
      regs.forEach(r => r.unregister());
    });
  }
}

/* ================= BLE CONFIG ================= */
const SERVICE = "12345678-1234-1234-1234-1234567890ab";
const RX = "12345678-1234-1234-1234-1234567890ac";
const TX = "12345678-1234-1234-1234-1234567890ad";

let device, rxChar, txChar;
let rxBuffer = "";

/* ================= DOM ================= */
const overlay = document.getElementById("overlay");
const settingsModal = document.getElementById("settingsModal");
const statusEl = document.getElementById("status");
const quickConnectBtn = document.getElementById("quickConnectBtn");
const batteryEl = document.getElementById("battery");
const cameraBG = document.getElementById("cameraBG");
const menuBtn = document.getElementById("menuBtn");
const fullscreenBtn = document.getElementById("fullscreenBtn");
const connectBtn = document.getElementById("connectBtn");
const disconnectBtn = document.getElementById("disconnectBtn");
const closeSettingsBtn = document.getElementById("closeSettingsBtn");
const speedVal = document.getElementById("speedVal");
const steeringGainVal = document.getElementById("steeringGainVal");
const invertSideway = document.getElementById("invertSideway");
const invertYaw = document.getElementById("invertYaw");
const invertForward = document.getElementById("invertForward");
const cameraToggle = document.getElementById("cameraToggle");

/* ================= CONTROL STATE ================= */
let forward = 0;       // forward/reverse (-1 to 1) from Right Joystick
let sideway = 0;       // strafe left/right (-1 to 1) from Right Joystick
let yaw = 0;           // steering / rotation (-1 to 1) from Left Joystick
let leftForward = 0;   // forward/reverse from Left Joystick when Right Joy is idle
let rightJoyActive = false;

/* ================= SETTINGS ================= */
let appSettings = Object.assign({
  maxSpeed: 1.0,
  steeringGain: 1.0,
  invertSideway: false,
  invertYaw: false,
  invertForward: false,
  cameraBG: false
}, JSON.parse(localStorage.getItem("settings") || "{}"));

function updateSliderLabels() {
  if (speedVal) speedVal.textContent = Math.round(appSettings.maxSpeed * 100) + "%";
  if (steeringGainVal) steeringGainVal.textContent = (+appSettings.steeringGain).toFixed(2) + "x";
}

function saveSettings() {
  localStorage.setItem("settings", JSON.stringify(appSettings));
}

/* ================= DRAGGABLE SLIDER COMPONENT ================= */
function createCustomSlider(containerEl, { min, max, step, initialValue, onInput }) {
  const fill = containerEl.querySelector(".slider-fill");
  const thumb = containerEl.querySelector(".slider-thumb");
  let val = initialValue;
  let isDragging = false;

  function render(v) {
    const clamped = Math.max(min, Math.min(max, v));
    const pct = ((clamped - min) / (max - min)) * 100;
    thumb.style.left = `${pct}%`;
    fill.style.width = `${pct}%`;
  }

  function setValue(newVal, trigger = true) {
    val = Math.max(min, Math.min(max, newVal));
    render(val);
    if (trigger && onInput) onInput(val);
  }

  function updateFromPointer(clientX) {
    const rect = containerEl.getBoundingClientRect();
    if (rect.width <= 0) return;
    let ratio = (clientX - rect.left) / rect.width;
    ratio = Math.max(0, Math.min(1, ratio));
    let rawVal = min + ratio * (max - min);
    const steps = Math.round((rawVal - min) / step);
    let steppedVal = min + steps * step;
    steppedVal = +steppedVal.toFixed(4);
    steppedVal = Math.max(min, Math.min(max, steppedVal));
    setValue(steppedVal, true);
  }

  // ONLY dragging the thumb moves the slider (clicking the track does nothing)
  thumb.addEventListener("pointerdown", e => {
    isDragging = true;
    containerEl.classList.add("dragging");
    thumb.setPointerCapture(e.pointerId);
    e.stopPropagation();
    e.preventDefault();
  });

  thumb.addEventListener("pointermove", e => {
    if (!isDragging) return;
    updateFromPointer(e.clientX);
  });

  const onEnd = e => {
    if (isDragging) {
      isDragging = false;
      containerEl.classList.remove("dragging");
      try { thumb.releasePointerCapture(e.pointerId); } catch (_) {}
    }
  };
  thumb.addEventListener("pointerup", onEnd);
  thumb.addEventListener("pointercancel", onEnd);

  setValue(initialValue, false);

  return {
    get value() { return val; },
    set value(v) { setValue(v, false); }
  };
}

const speedSlider = createCustomSlider(document.getElementById("speedSlider"), {
  min: 0.2,
  max: 1.0,
  step: 0.05,
  initialValue: appSettings.maxSpeed,
  onInput: val => {
    appSettings.maxSpeed = val;
    updateSliderLabels();
    saveSettings();
  }
});

const steeringGainSlider = createCustomSlider(document.getElementById("steeringGainSlider"), {
  min: 0.1,
  max: 1.5,
  step: 0.05,
  initialValue: appSettings.steeringGain !== undefined ? appSettings.steeringGain : 1.0,
  onInput: val => {
    appSettings.steeringGain = val;
    updateSliderLabels();
    saveSettings();
  }
});

invertSideway.checked = appSettings.invertSideway;
invertYaw.checked = appSettings.invertYaw;
invertForward.checked = appSettings.invertForward;
cameraToggle.checked = appSettings.cameraBG;
updateSliderLabels();

/* ================= SETTINGS EVENTS ================= */
invertSideway.onchange = e => { appSettings.invertSideway = e.target.checked; saveSettings(); };
invertYaw.onchange = e => { appSettings.invertYaw = e.target.checked; saveSettings(); };
invertForward.onchange = e => { appSettings.invertForward = e.target.checked; saveSettings(); };
cameraToggle.onchange = e => toggleCamera(e.target.checked);

/* ================= SETTINGS MODAL ================= */
function openSettings() {
  overlay.style.display = "block";
  settingsModal.style.display = "block";
}
function closeSettings() {
  overlay.style.display = "none";
  settingsModal.style.display = "none";
}
menuBtn.onclick = openSettings;
closeSettingsBtn.onclick = overlay.onclick = closeSettings;

/* ================= CAMERA ================= */
let cameraStream = null;
async function toggleCamera(on) {
  appSettings.cameraBG = on;
  saveSettings();
  if (on) {
    cameraStream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: "environment" } }, audio: false
    });
    cameraBG.srcObject = cameraStream;
    cameraBG.style.display = "block";
  } else {
    cameraBG.style.display = "none";
    cameraStream?.getTracks().forEach(t => t.stop());
  }
}

/* ================= BLE CONNECT & DISCONNECT ================= */
function updateBleUi(connected) {
  if (connected) {
    statusEl.innerHTML = `Connected <span class="version-badge">v${APP_VERSION}</span>`;
    statusEl.className = "status-connected";
    connectBtn.style.display = "none";
    disconnectBtn.style.display = "block";
    quickConnectBtn.style.display = "none";
  } else {
    statusEl.innerHTML = `Not connect <span class="version-badge">v${APP_VERSION}</span>`;
    statusEl.className = "status-disconnected";
    batteryEl.textContent = "V: --.- V | I: ---.- mA";
    connectBtn.style.display = "block";
    disconnectBtn.style.display = "none";
    quickConnectBtn.style.display = "inline-flex";
    rxChar = null;
    txChar = null;
    isWriting = false;
  }
}

function onDisconnected() {
  updateBleUi(false);
  showToast("BLE Disconnected");
}

async function startBleConnection() {
  try {
    device = await navigator.bluetooth.requestDevice({
      filters: [
        { namePrefix: "ANT-BOT" }
      ],
      optionalServices: [SERVICE]
    });

    device.addEventListener('gattserverdisconnected', onDisconnected);

    const server = await device.gatt.connect();
    const service = await server.getPrimaryService(SERVICE);

    rxChar = await service.getCharacteristic(RX);
    txChar = await service.getCharacteristic(TX);

    await txChar.startNotifications();
    txChar.addEventListener("characteristicvaluechanged", onNotify);

    updateBleUi(true);
    closeSettings();
    showToast("Connected to ANT-BOT");
  } catch (e) {
    updateBleUi(false);
    console.error(e);
  }
}

connectBtn.onclick = startBleConnection;
quickConnectBtn.onclick = startBleConnection;
statusEl.onclick = () => {
  if (!rxChar) startBleConnection();
};

disconnectBtn.onclick = () => {
  if (device && device.gatt && device.gatt.connected) {
    device.gatt.disconnect();
  } else {
    onDisconnected();
  }
};

/* ================= BLE RX ================= */
function onNotify(e) {
  const data = new TextDecoder().decode(e.target.value);
  for (let idx = 0; idx < data.length; idx++) {
    const c = data[idx];
    if (c === "\n" || c === "\r") {
      if (rxBuffer.trim().length > 0) handleStatus(rxBuffer);
      rxBuffer = "";
    } else {
      rxBuffer += c;
    }
  }
}

/* ================= MOTOR LOOP ================= */
let isWriting = false;

setInterval(async () => {
  if (!rxChar || isWriting) return;

  const activeFwd = rightJoyActive ? forward : leftForward;
  const steerGain = appSettings.steeringGain !== undefined ? appSettings.steeringGain : 1.0;
  const x = Math.round(Math.min(100, Math.max(-100, sideway * appSettings.maxSpeed * 100)));
  const y = Math.round(Math.min(100, Math.max(-100, activeFwd * appSettings.maxSpeed * 100)));
  const z = Math.round(Math.min(100, Math.max(-100, yaw * appSettings.maxSpeed * steerGain * 100)));

  const packet = new TextEncoder().encode(`drive ${x},${y},${z}\n`);
  isWriting = true;
  try {
    if (rxChar.writeValueWithoutResponse) {
      await rxChar.writeValueWithoutResponse(packet);
    } else {
      await rxChar.writeValue(packet);
    }
  } catch (err) {
    console.warn("Write dropped/error:", err);
  } finally {
    isWriting = false;
  }
}, 35);

/* ================= STATUS PARSER ================= */
function handleStatus(msg) {
  const v = msg.match(/V=([-\d.]+)/);
  const i = msg.match(/I=([-\d.]+)/);
  if (v && i) {
    batteryEl.textContent =
      `V: ${(+v[1]).toFixed(2)} V | I: ${(+i[1]).toFixed(1)} mA`;
  }
}

/* ================= RELATIVE JOYSTICK ================= */
function setupJoystick(el, onMove, onRelease, onStart) {
  const knob = el.querySelector(".knob");
  const r = el.clientWidth / 2;
  const kr = knob.clientWidth / 2;
  const maxDist = r - kr;

  let active = false, sx = 0, sy = 0;

  function update(dx, dy) {
    const d = Math.min(maxDist, Math.hypot(dx, dy));
    const a = Math.atan2(dy, dx);
    const px = Math.cos(a) * d;
    const py = Math.sin(a) * d;
    knob.style.transform = `translate(${px}px,${py}px) translate(-50%,-50%)`;
    onMove(px / maxDist, py / maxDist);
  }

  el.addEventListener("pointerdown", e => {
    el.setPointerCapture(e.pointerId);
    active = true;
    sx = e.clientX; sy = e.clientY;
    if (onStart) onStart();
    update(0, 0);
  });
  el.addEventListener("pointermove", e => { if (active) update(e.clientX - sx, e.clientY - sy); });
  const end = () => {
    active = false;
    knob.style.transform = "translate(-50%,-50%)";
    onRelease();
  };
  el.addEventListener("pointerup", end);
  el.addEventListener("pointercancel", end);
}

/* ================= FULLSCREEN ================= */
function isFullscreen() {
  return !!(
    document.fullscreenElement ||
    document.webkitFullscreenElement ||
    document.mozFullScreenElement ||
    document.msFullscreenElement ||
    document.body.classList.contains("is-fullscreen")
  );
}

function showToast(msg, duration = 3000) {
  const toast = document.getElementById("toast");
  if (!toast) return;
  toast.textContent = msg;
  toast.classList.add("show");
  clearTimeout(toast._timer);
  toast._timer = setTimeout(() => toast.classList.remove("show"), duration);
}

async function toggleFullscreen() {
  const doc = document.documentElement;
  const isFs = isFullscreen();

  if (!isFs) {
    let entered = false;

    // Standard Fullscreen API (Android Chrome, Edge, etc.)
    if (doc.requestFullscreen) {
      try {
        await doc.requestFullscreen({ navigationUI: "hide" });
        entered = true;
      } catch (err) {
        try {
          await doc.requestFullscreen();
          entered = true;
        } catch (err2) {
          console.warn("doc.requestFullscreen fallback failed:", err2);
        }
      }
    }

    // Body fallback
    if (!entered && document.body.requestFullscreen) {
      try {
        await document.body.requestFullscreen({ navigationUI: "hide" });
        entered = true;
      } catch (err) {
        try {
          await document.body.requestFullscreen();
          entered = true;
        } catch (err2) {}
      }
    }

    // WebKit prefix (iPadOS / Safari)
    if (!entered && doc.webkitRequestFullscreen) {
      try {
        doc.webkitRequestFullscreen();
        entered = true;
      } catch (err) {}
    }
    if (!entered && document.body.webkitRequestFullscreen) {
      try {
        document.body.webkitRequestFullscreen();
        entered = true;
      } catch (err) {}
    }

    // Orientation lock if available
    if (screen.orientation && screen.orientation.lock) {
      screen.orientation.lock("landscape").catch(() => {});
    }

    if (entered) {
      showToast("Fullscreen Active");
    } else {
      // iOS iPhone fallback where element Fullscreen API is disabled by Apple
      document.body.classList.add("is-fullscreen");
      window.scrollTo(0, 1);
      const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
      if (isIOS) {
        showToast("iOS: Tap Share > Add to Home Screen for borderless fullscreen", 4500);
      } else {
        showToast("Fullscreen Mode");
      }
    }
  } else {
    document.body.classList.remove("is-fullscreen");
    try {
      if (document.exitFullscreen) {
        await document.exitFullscreen();
      } else if (document.webkitExitFullscreen) {
        document.webkitExitFullscreen();
      }
    } catch (e) {}
    if (screen.orientation && screen.orientation.unlock) {
      screen.orientation.unlock().catch(() => {});
    }
    showToast("Exited Fullscreen");
  }
  updateFsIcon();
}

let lastFsToggle = 0;
function onFullscreenClick(e) {
  if (e && e.cancelable) e.preventDefault();
  const now = Date.now();
  if (now - lastFsToggle < 350) return;
  lastFsToggle = now;
  toggleFullscreen();
}

fullscreenBtn.addEventListener("click", onFullscreenClick);
fullscreenBtn.addEventListener("touchend", onFullscreenClick);

const FS_ICON_ENTER = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 3 21 3 21 9"/><polyline points="9 21 3 21 3 15"/><line x1="21" y1="3" x2="14" y2="10"/><line x1="3" y1="21" x2="10" y2="14"/></svg>';
const FS_ICON_EXIT  = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="4 14 10 14 10 20"/><polyline points="20 10 14 10 14 4"/><line x1="14" y1="10" x2="21" y2="3"/><line x1="10" y1="14" x2="3" y2="21"/></svg>';

function updateFsIcon() {
  fullscreenBtn.innerHTML = isFullscreen() ? FS_ICON_EXIT : FS_ICON_ENTER;
}
document.addEventListener("fullscreenchange", updateFsIcon);
document.addEventListener("webkitfullscreenchange", updateFsIcon);
updateFsIcon();

/* ================= INIT ================= */
// Left Joystick: Controls steering (Yaw) + Forward (when Right Joy is not touched)
setupJoystick(
  document.getElementById("joyYaw"),
  (nx, ny) => {
    yaw = appSettings.invertYaw ? -nx : nx;
    leftForward = appSettings.invertForward ? ny : -ny;
  },
  () => {
    yaw = 0;
    leftForward = 0;
  }
);

// Right Joystick: Controls Forward and Sideway (takes precedence when touched)
setupJoystick(
  document.getElementById("joyDrive"),
  (nx, ny) => {
    sideway = appSettings.invertSideway ? -nx : nx;
    forward = appSettings.invertForward ? ny : -ny;
  },
  () => {
    rightJoyActive = false;
    forward = 0;
    sideway = 0;
  },
  () => {
    rightJoyActive = true;
  }
);

if (appSettings.cameraBG) toggleCamera(true);

// Prevent accidental text selection and context menu callouts on mobile touch
document.addEventListener("selectstart", (e) => {
  if (e.target.tagName !== "INPUT" && e.target.tagName !== "TEXTAREA") {
    e.preventDefault();
  }
});
document.addEventListener("contextmenu", (e) => {
  if (e.target.tagName !== "INPUT" && e.target.tagName !== "TEXTAREA") {
    e.preventDefault();
  }
});
</script>
