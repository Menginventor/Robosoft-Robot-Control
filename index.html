<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">

<meta http-equiv="Expires" content="0">
<meta name="apple-mobile-web-app-capable" content="yes">

<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#111111" id="themeColorMeta">
<title>ANT-BOT Control v1.0.8</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

<link rel="stylesheet" href="style.css">
</head>

<body>

<video id="cameraBG" autoplay muted playsinline></video>
<div id="overlay"></div>

<!-- ===== SETTINGS ===== -->
<div id="settingsModal">
  <div class="settings-header">⚙ Settings <span class="version-badge">v1.0.8</span></div>

  <!-- Settings Navigation Tabs -->
  <div class="settings-nav">
    <button type="button" class="settings-nav-btn active" id="tabBtnControls" data-tab="controls">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="2" y="6" width="20" height="12" rx="3"></rect>
        <line x1="6" y1="12" x2="10" y2="12"></line>

        <circle cx="18" cy="10" r="1" fill="currentColor"></circle>

      Controls
    </button>
    <button type="button" class="settings-nav-btn" id="tabBtnPersonalize" data-tab="personalize">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">

            <line x1="1" y1="12" x2="3" y2="12"></line>
            <line x1="21" y1="12" x2="23" y2="12"></line>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>

        <button type="button" class="swatch-btn" data-theme-val="amber" title="Amber Gold" style="--swatch-color: #f59e0b;"></button>
        <button type="button" class="swatch-btn" data-theme-val="crimson" title="Crimson" style="--swatch-color: #ef4444;"></button>

<!-- ===== TOP BAR ===== -->
<div id="top">

    <!-- Quick Connection Popover -->
    <div id="blePopover" class="ble-popover" style="display: none;">
      <div class="popover-header">
        <span class="popover-title" id="popoverDeviceName">ANT-BOT</span>

      <div class="popover-info" id="popoverBattery">Telemetry: --</div>
      <div class="popover-actions">
        <button id="popoverDisconnectBtn" class="popover-btn danger">Disconnect</button>
        <button id="popoverSettingsBtn" class="popover-btn secondary">Settings ⚙</button>

    </div>
  </div>
  <div id="battery">Telemetry: --</div>
</div>

<!-- ===== JOYSTICKS ===== -->
<div class="joy joy-left disabled" id="joyYaw">
  <div class="joy-label">STEER / DRIVE</div>
  <div class="knob"></div>
</div>

<div class="joy joy-right disabled" id="joyDrive">
  <div class="joy-label">MOVE (FWD/SIDE)</div>
  <div class="knob"></div>
</div>

<div id="toast"></div>

<script>
/* ================= VERSION & CACHE MANAGEMENT ================= */
const APP_VERSION = "1.0.8";
if (localStorage.getItem("app_version") !== APP_VERSION) {
  localStorage.setItem("app_version", APP_VERSION);
  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.getRegistrations().then(regs => {
      regs.forEach(r => r.unregister());
    });
  }
}

/* ================= BLE CONFIG ================= */
const SERVICE = "12345678-1234-1234-1234-1234567890ab";
const RX = "12345678-1234-1234-1234-1234567890ac";
const TX = "12345678-1234-1234-1234-1234567890ad";

let device, rxChar, txChar;
let rxBuffer = "";

/* ================= DOM ================= */
const overlay = document.getElementById("overlay");
const settingsModal = document.getElementById("settingsModal");
const blePill = document.getElementById("blePill");
const blePillText = document.getElementById("blePillText");
const blePopover = document.getElementById("blePopover");
const popoverDeviceName = document.getElementById("popoverDeviceName");
const popoverBattery = document.getElementById("popoverBattery");
const popoverTelemetry = popoverBattery;
const popoverDisconnectBtn = document.getElementById("popoverDisconnectBtn");
const popoverSettingsBtn = document.getElementById("popoverSettingsBtn");
const batteryEl = document.getElementById("battery");
const telemetryEl = batteryEl;
const cameraBG = document.getElementById("cameraBG");
const menuBtn = document.getElementById("menuBtn");
const fullscreenBtn = document.getElementById("fullscreenBtn");
const tabBtnControls = document.getElementById("tabBtnControls");
const tabBtnPersonalize = document.getElementById("tabBtnPersonalize");
const panelControls = document.getElementById("panelControls");
const panelPersonalize = document.getElementById("panelPersonalize");
const joyYaw = document.getElementById("joyYaw");
const joyDrive = document.getElementById("joyDrive");
const connectBtn = document.getElementById("connectBtn");
const disconnectBtn = document.getElementById("disconnectBtn");
const closeSettingsBtn = document.getElementById("closeSettingsBtn");
const speedVal = document.getElementById("speedVal");
const steeringGainVal = document.getElementById("steeringGainVal");
const invertSideway = document.getElementById("invertSideway");
const invertYaw = document.getElementById("invertYaw");
const invertForward = document.getElementById("invertForward");
const cameraToggle = document.getElementById("cameraToggle");

/* ================= CONTROL STATE ================= */
let forward = 0;       // forward/reverse (-1 to 1) from Right Joystick
let sideway = 0;       // strafe left/right (-1 to 1) from Right Joystick
let yaw = 0;           // steering / rotation (-1 to 1) from Left Joystick
let leftForward = 0;   // forward/reverse from Left Joystick when Right Joy is idle
let rightJoyActive = false;

/* ================= SETTINGS ================= */
const DEFAULT_SETTINGS = {
  maxSpeed: 1.0,      // 100%
  steeringGain: 1.0,  // 1.00x
  invertSideway: false,
  invertYaw: false,
  invertForward: false,
  cameraBG: false,
  tone: "dark",
  theme: "blue"
};

let savedSettings = {};
try {
  savedSettings = JSON.parse(localStorage.getItem("settings") || "{}");
} catch (_) {}

let appSettings = Object.assign({}, DEFAULT_SETTINGS, savedSettings);

// Ensure maxSpeed and steeringGain default to 1.0 (100% / 1.00x) if missing or invalid
if (typeof appSettings.maxSpeed !== "number" || isNaN(appSettings.maxSpeed)) {
  appSettings.maxSpeed = DEFAULT_SETTINGS.maxSpeed;
}
if (typeof appSettings.steeringGain !== "number" || isNaN(appSettings.steeringGain)) {
  appSettings.steeringGain = DEFAULT_SETTINGS.steeringGain;
}

function applyPersonalization() {
  const tone = appSettings.tone || "dark";
  const theme = appSettings.theme || "blue";

  document.documentElement.setAttribute("data-tone", tone);
  document.documentElement.setAttribute("data-theme", theme);

  const themeColorMeta = document.getElementById("themeColorMeta");
  if (themeColorMeta) {
    themeColorMeta.setAttribute("content", tone === "light" ? "#f2f3f7" : "#111111");
  }

  document.querySelectorAll("#toneControl .segment-btn").forEach(btn => {
    btn.classList.toggle("active", btn.dataset.toneVal === tone);
  });

  document.querySelectorAll("#themeSwatches .swatch-btn").forEach(btn => {
    btn.classList.toggle("active", btn.dataset.themeVal === theme);
  });
}

function updateSliderLabels() {
  if (speedVal) speedVal.textContent = Math.round(appSettings.maxSpeed * 100) + "%";
  if (steeringGainVal) steeringGainVal.textContent = (+appSettings.steeringGain).toFixed(2) + "x";
}

function saveSettings() {
  localStorage.setItem("settings", JSON.stringify(appSettings));
}

/* ================= DRAGGABLE SLIDER COMPONENT ================= */
function createCustomSlider(containerEl, { min, max, step, initialValue, onInput }) {
  const fill = containerEl.querySelector(".slider-fill");
  const thumb = containerEl.querySelector(".slider-thumb");
  let val = initialValue;
  let isDragging = false;

  function render(v) {
    const clamped = Math.max(min, Math.min(max, v));
    const pct = ((clamped - min) / (max - min)) * 100;
    thumb.style.left = `${pct}%`;
    fill.style.width = `${pct}%`;
  }

  function setValue(newVal, trigger = true) {
    val = Math.max(min, Math.min(max, newVal));
    render(val);
    if (trigger && onInput) onInput(val);
  }

  function updateFromPointer(clientX) {
    const rect = containerEl.getBoundingClientRect();
    if (rect.width <= 0) return;
    let ratio = (clientX - rect.left) / rect.width;
    ratio = Math.max(0, Math.min(1, ratio));
    let rawVal = min + ratio * (max - min);
    const steps = Math.round((rawVal - min) / step);
    let steppedVal = min + steps * step;
    steppedVal = +steppedVal.toFixed(4);
    steppedVal = Math.max(min, Math.min(max, steppedVal));
    setValue(steppedVal, true);
  }

  // ONLY dragging the thumb moves the slider (clicking the track does nothing)
  thumb.addEventListener("pointerdown", e => {
    isDragging = true;
    containerEl.classList.add("dragging");
    thumb.setPointerCapture(e.pointerId);
    e.stopPropagation();
    e.preventDefault();
  });

  thumb.addEventListener("pointermove", e => {
    if (!isDragging) return;
    updateFromPointer(e.clientX);
  });

  const onEnd = e => {
    if (isDragging) {
      isDragging = false;
      containerEl.classList.remove("dragging");
      try { thumb.releasePointerCapture(e.pointerId); } catch (_) {}
    }
  };
  thumb.addEventListener("pointerup", onEnd);
  thumb.addEventListener("pointercancel", onEnd);

  setValue(initialValue, false);

  return {
    get value() { return val; },
    set value(v) { setValue(v, false); }
  };
}

const speedSlider = createCustomSlider(document.getElementById("speedSlider"), {
  min: 0.2,
  max: 1.0,
  step: 0.05,
  initialValue: typeof appSettings.maxSpeed === "number" && !isNaN(appSettings.maxSpeed) ? appSettings.maxSpeed : DEFAULT_SETTINGS.maxSpeed,
  onInput: val => {
    appSettings.maxSpeed = val;
    updateSliderLabels();
    saveSettings();
  }
});

const steeringGainSlider = createCustomSlider(document.getElementById("steeringGainSlider"), {
  min: 0.1,
  max: 1.5,
  step: 0.05,
  initialValue: typeof appSettings.steeringGain === "number" && !isNaN(appSettings.steeringGain) ? appSettings.steeringGain : DEFAULT_SETTINGS.steeringGain,
  onInput: val => {
    appSettings.steeringGain = val;
    updateSliderLabels();
    saveSettings();
  }
});

invertSideway.checked = appSettings.invertSideway;
invertYaw.checked = appSettings.invertYaw;
invertForward.checked = appSettings.invertForward;
cameraToggle.checked = appSettings.cameraBG;
updateSliderLabels();

/* ================= SETTINGS EVENTS ================= */
invertSideway.onchange = e => { appSettings.invertSideway = e.target.checked; saveSettings(); };
invertYaw.onchange = e => { appSettings.invertYaw = e.target.checked; saveSettings(); };
invertForward.onchange = e => { appSettings.invertForward = e.target.checked; saveSettings(); };
cameraToggle.onchange = e => toggleCamera(e.target.checked);

const resetDefaultsBtn = document.getElementById("resetDefaultsBtn");
if (resetDefaultsBtn) {
  resetDefaultsBtn.addEventListener("click", () => {
    appSettings.maxSpeed = DEFAULT_SETTINGS.maxSpeed;
    appSettings.steeringGain = DEFAULT_SETTINGS.steeringGain;
    appSettings.invertSideway = DEFAULT_SETTINGS.invertSideway;
    appSettings.invertYaw = DEFAULT_SETTINGS.invertYaw;
    appSettings.invertForward = DEFAULT_SETTINGS.invertForward;

    speedSlider.value = appSettings.maxSpeed;
    steeringGainSlider.value = appSettings.steeringGain;
    invertSideway.checked = appSettings.invertSideway;
    invertYaw.checked = appSettings.invertYaw;
    invertForward.checked = appSettings.invertForward;

    updateSliderLabels();
    saveSettings();
    showToast("Driving controls reset to defaults (100% / 1.00x)");
  });
}

document.querySelectorAll("#toneControl .segment-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    appSettings.tone = btn.dataset.toneVal;
    saveSettings();
    applyPersonalization();
  });
});

document.querySelectorAll("#themeSwatches .swatch-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    appSettings.theme = btn.dataset.themeVal;
    saveSettings();
    applyPersonalization();
  });
});

// Apply saved personalization immediately on startup
applyPersonalization();

/* ================= SETTINGS MODAL & TABS ================= */
function switchSettingsTab(tab) {
  const isPersonalize = tab === "personalize";
  if (panelControls) panelControls.style.display = isPersonalize ? "none" : "block";
  if (panelPersonalize) panelPersonalize.style.display = isPersonalize ? "block" : "none";
  if (tabBtnControls) tabBtnControls.classList.toggle("active", !isPersonalize);
  if (tabBtnPersonalize) tabBtnPersonalize.classList.toggle("active", isPersonalize);
}

if (tabBtnControls) tabBtnControls.onclick = () => switchSettingsTab("controls");
if (tabBtnPersonalize) tabBtnPersonalize.onclick = () => switchSettingsTab("personalize");

function openSettings(initialTab = "controls") {
  switchSettingsTab(initialTab);
  overlay.style.display = "block";
  settingsModal.style.display = "block";
}
function closeSettings() {
  overlay.style.display = "none";
  settingsModal.style.display = "none";
}
menuBtn.onclick = () => openSettings("controls");
closeSettingsBtn.onclick = overlay.onclick = closeSettings;

/* ================= CAMERA ================= */
let cameraStream = null;
async function toggleCamera(on) {
  appSettings.cameraBG = on;
  saveSettings();
  if (on) {
    cameraStream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: "environment" } }, audio: false
    });
    cameraBG.srcObject = cameraStream;
    cameraBG.style.display = "block";
  } else {
    cameraBG.style.display = "none";
    cameraStream?.getTracks().forEach(t => t.stop());
  }
}

/* ================= BLE CONNECT & DISCONNECT ================= */
function updateBleUi(connected) {
  if (joyYaw) joyYaw.classList.toggle("disabled", !connected);
  if (joyDrive) joyDrive.classList.toggle("disabled", !connected);

  if (connected) {
    blePill.className = "ble-pill connected";
    const devName = (device && device.name) ? device.name : "Connected";
    blePillText.textContent = devName;
    popoverDeviceName.textContent = devName;
    popoverBattery.textContent = batteryEl.textContent;
    connectBtn.style.display = "none";
    disconnectBtn.style.display = "block";
  } else {
    blePill.className = "ble-pill disconnected";
    blePillText.textContent = "Not connect";
    batteryEl.textContent = "Telemetry: --";
    popoverBattery.textContent = "Telemetry: --";
    blePopover.style.display = "none";
    connectBtn.style.display = "block";
    disconnectBtn.style.display = "none";
    rxChar = null;
    txChar = null;
    isWriting = false;

    // Reset controls and re-center joysticks when disconnected
    forward = 0; sideway = 0; yaw = 0; leftForward = 0; rightJoyActive = false;
    document.querySelectorAll(".joy .knob").forEach(knob => {
      knob.style.transform = "translate(-50%, -50%)";
    });
  }
}

function onDisconnected() {
  updateBleUi(false);
  showToast("BLE Disconnected");
}

async function startBleConnection() {
  try {
    device = await navigator.bluetooth.requestDevice({
      filters: [
        { namePrefix: "ANT-BOT" }
      ],
      optionalServices: [SERVICE]
    });

    device.addEventListener('gattserverdisconnected', onDisconnected);

    const server = await device.gatt.connect();
    const service = await server.getPrimaryService(SERVICE);

    rxChar = await service.getCharacteristic(RX);
    txChar = await service.getCharacteristic(TX);

    await txChar.startNotifications();
    txChar.addEventListener("characteristicvaluechanged", onNotify);

    updateBleUi(true);
    closeSettings();
    showToast("Connected to ANT-BOT");
  } catch (e) {
    updateBleUi(false);
    console.error(e);
  }
}

// Click on pill: if not connected, connect; if connected, show options popover
blePill.onclick = (e) => {
  e.stopPropagation();
  if (!rxChar) {
    startBleConnection();
  } else {
    const isShowing = blePopover.style.display === "block";
    blePopover.style.display = isShowing ? "none" : "block";
    if (!isShowing) {
      popoverBattery.textContent = batteryEl.textContent;
    }
  }
};

popoverDisconnectBtn.onclick = (e) => {
  e.stopPropagation();

/* ================= BLE RX ================= */
function onNotify(e) {
  const data = new TextDecoder().decode(e.target.value);
  for (let idx = 0; idx < data.length; idx++) {
    const c = data[idx];
    if (c === "\n" || c === "\r") {
      if (rxBuffer.trim().length > 0) handleStatus(rxBuffer);
      rxBuffer = "";
    } else {
      rxBuffer += c;
    }
  }
}

/* ================= MOTOR LOOP ================= */
let isWriting = false;

setInterval(async () => {
  if (!rxChar || isWriting) return;

  const activeFwd = rightJoyActive ? forward : leftForward;
  const steerGain = appSettings.steeringGain !== undefined ? appSettings.steeringGain : 1.0;
  const x = Math.round(Math.min(100, Math.max(-100, sideway * appSettings.maxSpeed * 100)));
  const y = Math.round(Math.min(100, Math.max(-100, activeFwd * appSettings.maxSpeed * 100)));
  const z = Math.round(Math.min(100, Math.max(-100, yaw * appSettings.maxSpeed * steerGain * 100)));

  const packet = new TextEncoder().encode(`drive ${x},${y},${z}\n`);
  isWriting = true;
  try {
    if (rxChar.writeValueWithoutResponse) {
      await rxChar.writeValueWithoutResponse(packet);
    } else {
      await rxChar.writeValue(packet);
    }
  } catch (err) {
    console.warn("Write dropped/error:", err);
  } finally {
    isWriting = false;
  }
}, 35);

/* ================= TELEMETRY / STATUS PARSER ================= */
function formatTelemetryValue(key, rawVal) {
  const upperKey = key.toUpperCase();
  const num = Number(rawVal);
  const isNumeric = !isNaN(num) && rawVal.trim() !== "";

  if (isNumeric) {
    if (upperKey === "V" || upperKey === "VOLT" || upperKey === "VOLTAGE") {
      return `${key}: ${num.toFixed(2)} V`;
    }
    if (upperKey === "I" || upperKey === "CUR" || upperKey === "CURRENT") {
      return `${key}: ${num.toFixed(1)} mA`;
    }
    if (upperKey === "BAT" || upperKey === "BATT" || upperKey === "BATTERY" || upperKey === "SOC") {
      return `${key}: ${Math.round(num)}%`;
    }
    if (upperKey === "TEMP" || upperKey === "TEMPERATURE") {
      return `${key}: ${num.toFixed(1)}°C`;
    }
    if (upperKey === "RPM") {
      return `${key}: ${Math.round(num)} RPM`;
    }
    if (upperKey === "DIST" || upperKey === "DISTANCE") {
      return `${key}: ${num.toFixed(1)} cm`;
    }
    if (!Number.isInteger(num)) {
      return `${key}: ${num.toFixed(2)}`;
    }
  }

  return `${key}: ${rawVal}`;
}

function handleStatus(msg) {
  if (!msg || typeof msg !== "string") return;
  const raw = msg.trim();
  if (!raw) return;

  let displayText = "";

  // 1. JSON telemetry object
  if (raw.startsWith("{") && raw.endsWith("}")) {
    try {
      const obj = JSON.parse(raw);
      const parts = [];
      for (const [k, v] of Object.entries(obj)) {
        parts.push(formatTelemetryValue(k, String(v)));
      }
      if (parts.length > 0) displayText = parts.join(" | ");
    } catch (_) {}
  }

  // 2. Key-Value pairs (e.g. "status V=4.12 I=120.5", "temp=25 hum=60", "RPM: 1200")
  if (!displayText) {
    const clean = raw.replace(/^(status|telemetry|data|info)[:\s]+/i, "").trim();
    const kvRegex = /([a-zA-Z0-9_#$@.-]+)\s*[:=]\s*([^\s,;|]+)/g;
    const matches = [...clean.matchAll(kvRegex)];

    if (matches.length > 0) {
      displayText = matches.map(m => formatTelemetryValue(m[1], m[2])).join(" | ");
    } else {
      // 3. Fallback for arbitrary/plain telemetry text
      displayText = clean;
    }
  }

  if (displayText) {
    batteryEl.textContent = displayText;
    if (popoverBattery) popoverBattery.textContent = displayText;
  }
}

/* ================= RELATIVE JOYSTICK ================= */
function setupJoystick(el, onMove, onRelease, onStart) {
  const knob = el.querySelector(".knob");
  const r = el.clientWidth / 2;
  const kr = knob.clientWidth / 2;
  const maxDist = r - kr;

  let active = false, sx = 0, sy = 0;

  function update(dx, dy) {
    const d = Math.min(maxDist, Math.hypot(dx, dy));
    const a = Math.atan2(dy, dx);
    const px = Math.cos(a) * d;
    const py = Math.sin(a) * d;
    knob.style.transform = `translate(${px}px,${py}px) translate(-50%,-50%)`;
    onMove(px / maxDist, py / maxDist);
  }

  el.addEventListener("pointerdown", e => {
    if (el.classList.contains("disabled") || !rxChar) return;
    el.classList.add("active");
    el.setPointerCapture(e.pointerId);
    active = true;
    sx = e.clientX; sy = e.clientY;
    if (onStart) onStart();
    update(0, 0);
  });
  el.addEventListener("pointermove", e => { if (active) update(e.clientX - sx, e.clientY - sy); });
  const end = () => {
    active = false;
    el.classList.remove("active");
    knob.style.transform = "translate(-50%,-50%)";
    onRelease();
  };
  el.addEventListener("pointerup", end);
  el.addEventListener("pointercancel", end);
}

/* ================= FULLSCREEN ================= */
function isFullscreen() {
  return !!(
    document.fullscreenElement ||
    document.webkitFullscreenElement ||
    document.mozFullScreenElement ||
    document.msFullscreenElement ||
    document.body.classList.contains("is-fullscreen")
  );
}

function showToast(msg, duration = 3000) {
  const toast = document.getElementById("toast");
  if (!toast) return;
  toast.textContent = msg;
  toast.classList.add("show");
  clearTimeout(toast._timer);
  toast._timer = setTimeout(() => toast.classList.remove("show"), duration);
}

async function toggleFullscreen() {
  const doc = document.documentElement;
  const isFs = isFullscreen();

  if (!isFs) {
    let entered = false;

    // Standard Fullscreen API (Android Chrome, Edge, etc.)
    if (doc.requestFullscreen) {
      try {
        await doc.requestFullscreen({ navigationUI: "hide" });
        entered = true;
      } catch (err) {
        try {
          await doc.requestFullscreen();
          entered = true;
        } catch (err2) {
          console.warn("doc.requestFullscreen fallback failed:", err2);
        }
      }
    }

    // Body fallback
    if (!entered && document.body.requestFullscreen) {
      try {
        await document.body.requestFullscreen({ navigationUI: "hide" });
        entered = true;
      } catch (err) {
        try {
          await document.body.requestFullscreen();
          entered = true;
        } catch (err2) {}
      }
    }

    // WebKit prefix (iPadOS / Safari)
    if (!entered && doc.webkitRequestFullscreen) {
      try {
        doc.webkitRequestFullscreen();
        entered = true;
      } catch (err) {}
    }
    if (!entered && document.body.webkitRequestFullscreen) {
      try {
        document.body.webkitRequestFullscreen();
        entered = true;
      } catch (err) {}
    }

    // Orientation lock if available
    if (screen.orientation && screen.orientation.lock) {
      screen.orientation.lock("landscape").catch(() => {});
    }

    if (entered) {
      showToast("Fullscreen Active");
    } else {
      // iOS iPhone fallback where element Fullscreen API is disabled by Apple
      document.body.classList.add("is-fullscreen");
      window.scrollTo(0, 1);
      const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
      if (isIOS) {
        showToast("iOS: Tap Share > Add to Home Screen for borderless fullscreen", 4500);
      } else {
        showToast("Fullscreen Mode");
      }
    }
  } else {
    document.body.classList.remove("is-fullscreen");
    try {
      if (document.exitFullscreen) {
        await document.exitFullscreen();
      } else if (document.webkitExitFullscreen) {
        document.webkitExitFullscreen();
      }
    } catch (e) {}
    if (screen.orientation && screen.orientation.unlock) {
      screen.orientation.unlock().catch(() => {});
    }
    showToast("Exited Fullscreen");
  }
  updateFsIcon();
}

let lastFsToggle = 0;
function onFullscreenClick(e) {
  if (e && e.cancelable) e.preventDefault();
  const now = Date.now();
  if (now - lastFsToggle < 350) return;
  lastFsToggle = now;
  toggleFullscreen();
}

fullscreenBtn.addEventListener("click", onFullscreenClick);
fullscreenBtn.addEventListener("touchend", onFullscreenClick);

const FS_ICON_ENTER = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 3 21 3 21 9"/><polyline points="9 21 3 21 3 15"/><line x1="21" y1="3" x2="14" y2="10"/><line x1="3" y1="21" x2="10" y2="14"/></svg>';
const FS_ICON_EXIT  = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="4 14 10 14 10 20"/><polyline points="20 10 14 10 14 4"/><line x1="14" y1="10" x2="21" y2="3"/><line x1="10" y1="14" x2="3" y2="21"/></svg>';

function updateFsIcon() {
  fullscreenBtn.innerHTML = isFullscreen() ? FS_ICON_EXIT : FS_ICON_ENTER;
}
document.addEventListener("fullscreenchange", updateFsIcon);
document.addEventListener("webkitfullscreenchange", updateFsIcon);
updateFsIcon();

/* ================= INIT ================= */
// Left Joystick: Controls steering (Yaw) + Forward (when Right Joy is not touched)
setupJoystick(
  document.getElementById("joyYaw"),
  (nx, ny) => {
    yaw = appSettings.invertYaw ? -nx : nx;
    leftForward = appSettings.invertForward ? ny : -ny;
  },
  () => {
    yaw = 0;
    leftForward = 0;
  }
);

// Right Joystick: Controls Forward and Sideway (takes precedence when touched)
setupJoystick(
  document.getElementById("joyDrive"),
  (nx, ny) => {
    sideway = appSettings.invertSideway ? -nx : nx;
    forward = appSettings.invertForward ? ny : -ny;
  },
  () => {
    rightJoyActive = false;
    forward = 0;
    sideway = 0;
  },
  () => {
    rightJoyActive = true;
  }
);

if (appSettings.cameraBG) toggleCamera(true);

// Prevent accidental text selection and context menu callouts on mobile touch
document.addEventListener("selectstart", (e) => {
  if (e.target.tagName !== "INPUT" && e.target.tagName !== "TEXTAREA") {
    e.preventDefault();
  }
});
document.addEventListener("contextmenu", (e) => {
  if (e.target.tagName !== "INPUT" && e.target.tagName !== "TEXTAREA") {
    e.preventDefault();
  }
});
</script>
