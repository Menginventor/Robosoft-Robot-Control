<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#111111">
<title>ANT-BOT Control v1.0.2</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

<style>
body {
  margin: 0;
  background: #111;
  color: #eee;
  font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
  overflow: hidden;
  overscroll-behavior: none;
  touch-action: none;
}

/* ===== CAMERA ===== */
#cameraBG {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: none;
  z-index: 0;
}

/* ===== TOP BAR ===== */
#top {
  padding: 12px;
  text-align: center;
  position: relative;
  z-index: 10;
}

#menuBtn, #fullscreenBtn {
  position: absolute;
  top: 8px;
  width: 44px;
  height: 44px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(255, 255, 255, 0.08);
  border: 1px solid rgba(255, 255, 255, 0.16);
  border-radius: 12px;
  color: #eee;
  font-size: 20px;
  cursor: pointer;
  touch-action: manipulation;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
  z-index: 20;
}

#menuBtn:active, #fullscreenBtn:active {
  background: rgba(255, 255, 255, 0.22);
  transform: scale(0.92);
}

#menuBtn { left: 12px; }
#fullscreenBtn { right: 12px; }

#status {
  font-size: 14px;
  font-weight: 600;
}
.status-connected { color: #4cff88; }
.status-disconnected { color: #ff5c5c; }

#battery {
  margin-top: 6px;
  font-size: 15px;
}

.version-badge {
  display: inline-block;
  font-size: 11px;
  font-weight: 700;
  padding: 2px 7px;
  border-radius: 6px;
  background: rgba(47, 128, 255, 0.2);
  color: #4da3ff;
  border: 1px solid rgba(47, 128, 255, 0.4);
  margin-left: 6px;
  vertical-align: middle;
}

/* ===== JOYSTICKS ===== */
.joy {
  position: fixed;
  bottom: 24px;
  width: 170px;
  height: 170px;
  border-radius: 50%;
  background: rgba(255,255,255,0.035);
  border: 1px solid rgba(255,255,255,0.12);
  backdrop-filter: blur(2px);
  z-index: 10;
  user-select: none;
  touch-action: none;
}

.joy-left {
  left: 20px;
}

.joy-right {
  right: 20px;
}

.joy-label {
  position: absolute;
  top: 14px;
  width: 100%;
  text-align: center;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 1.5px;
  color: rgba(255,255,255,0.3);
  pointer-events: none;
}

.knob {
  width: 70px;
  height: 70px;
  background: rgba(255,255,255,0.28);
  border-radius: 50%;
  border: 1px solid rgba(255,255,255,0.5);
  position: absolute;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%);
  pointer-events: none;
}

/* ===== OVERLAY ===== */
#overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.65);
  display: none;
  z-index: 1000;
}

/* ===== SETTINGS MODAL ===== */
#settingsModal {
  position: fixed;
  top: 50%;
  left: 50%;
  width: 320px;
  max-width: 90%;
  background: #1c1c1e;
  border-radius: 16px;
  padding: 18px;
  transform: translate(-50%, -50%);
  display: none;
  z-index: 1001;
  box-shadow: 0 20px 40px rgba(0,0,0,0.7);
}

.settings-header {
  text-align: center;
  font-size: 18px;
  font-weight: 600;
  margin-bottom: 16px;
}

.settings-section { margin-bottom: 18px; }

.settings-section-title {
  font-size: 13px;
  color: #aaa;
  margin-bottom: 8px;
  text-transform: uppercase;
}

.primary-btn {
  width: 100%;
  padding: 10px;
  border-radius: 10px;
  border: none;
  font-size: 15px;
  font-weight: 600;
  background: #2f80ff;
  color: white;
}

.secondary-btn {
  width: 100%;
  padding: 10px;
  border-radius: 10px;
  border: none;
  font-size: 14px;
  background: #333;
  color: #eee;
}

.toggle-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 8px 0;
  font-size: 15px;
}

input[type="range"] { width: 100%; }

/* ===== IOS PSEUDO-FULLSCREEN & TOAST ===== */
body.is-fullscreen {
  position: fixed;
  inset: 0;
  width: 100vw;
  height: 100vh;
  height: 100dvh;
}

#toast {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%) translateY(30px);
  background: rgba(22, 22, 26, 0.95);
  color: #fff;
  padding: 10px 18px;
  border-radius: 12px;
  border: 1px solid rgba(255, 255, 255, 0.18);
  box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
  font-size: 13px;
  font-weight: 500;
  pointer-events: none;
  opacity: 0;
  transition: opacity 0.25s ease, transform 0.25s ease;
  z-index: 1000;
  max-width: 90%;
  text-align: center;
}
#toast.show {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}
</style>
</head>

<body>

<video id="cameraBG" autoplay muted playsinline></video>
<div id="overlay"></div>

<!-- ===== SETTINGS ===== -->
<div id="settingsModal">
  <div class="settings-header">⚙ Settings <span class="version-badge">v1.0.2</span></div>

  <div class="settings-section">
    <button class="primary-btn" id="connectBtn">Connect to BLE</button>
  </div>

  <div class="settings-section">
    <div class="settings-section-title">Driving</div>
    <label>Max Speed</label>
    <input id="speedSlider" type="range" min="0.2" max="1" step="0.1">

    <div class="toggle-row">
      <span>Invert Sideway</span>
      <input id="invertSideway" type="checkbox">
    </div>

    <div class="toggle-row">
      <span>Invert Yaw (Steering)</span>
      <input id="invertYaw" type="checkbox">
    </div>

    <div class="toggle-row">
      <span>Invert Forward</span>
      <input id="invertForward" type="checkbox">
    </div>
  </div>

  <div class="settings-section">
    <div class="settings-section-title">View</div>
    <div class="toggle-row">
      <span>Camera Background</span>
      <input id="cameraToggle" type="checkbox">
    </div>
  </div>

  <button class="secondary-btn" id="closeSettingsBtn">Close</button>
</div>

<!-- ===== TOP BAR ===== -->
<div id="top">
  <button id="menuBtn">☰</button>
  <button id="fullscreenBtn">⛶</button>
  <div id="status" class="status-disconnected">Disconnected <span class="version-badge">v1.0.2</span></div>
  <div id="battery">V: --.- V | I: ---.- mA</div>
</div>

<!-- ===== JOYSTICKS ===== -->
<div class="joy joy-left" id="joyYaw">
  <div class="joy-label">STEER / DRIVE</div>
  <div class="knob"></div>
</div>

<div class="joy joy-right" id="joyDrive">
  <div class="joy-label">MOVE (FWD/SIDE)</div>
  <div class="knob"></div>
</div>

<div id="toast"></div>

<script>
/* ================= VERSION & CACHE MANAGEMENT ================= */
const APP_VERSION = "1.0.2";
if (localStorage.getItem("app_version") !== APP_VERSION) {
  localStorage.setItem("app_version", APP_VERSION);
  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.getRegistrations().then(regs => {
      regs.forEach(r => r.unregister());
    });
  }
}

/* ================= BLE CONFIG ================= */
const SERVICE = "12345678-1234-1234-1234-1234567890ab";
const RX = "12345678-1234-1234-1234-1234567890ac";
const TX = "12345678-1234-1234-1234-1234567890ad";

let device, rxChar, txChar;
let rxBuffer = "";

/* ================= DOM ================= */
const overlay = document.getElementById("overlay");
const settingsModal = document.getElementById("settingsModal");
const statusEl = document.getElementById("status");
const batteryEl = document.getElementById("battery");
const cameraBG = document.getElementById("cameraBG");
const menuBtn = document.getElementById("menuBtn");
const fullscreenBtn = document.getElementById("fullscreenBtn");
const connectBtn = document.getElementById("connectBtn");
const closeSettingsBtn = document.getElementById("closeSettingsBtn");
const speedSlider = document.getElementById("speedSlider");
const invertSideway = document.getElementById("invertSideway");
const invertYaw = document.getElementById("invertYaw");
const invertForward = document.getElementById("invertForward");
const cameraToggle = document.getElementById("cameraToggle");

/* ================= CONTROL STATE ================= */
let forward = 0;       // forward/reverse (-1 to 1) from Right Joystick
let sideway = 0;       // strafe left/right (-1 to 1) from Right Joystick
let yaw = 0;           // steering / rotation (-1 to 1) from Left Joystick
let leftForward = 0;   // forward/reverse from Left Joystick when Right Joy is idle
let rightJoyActive = false;

/* ================= SETTINGS ================= */
let appSettings = Object.assign({
  maxSpeed: 1.0,
  invertSideway: false,
  invertYaw: false,
  invertForward: false,
  cameraBG: false
}, JSON.parse(localStorage.getItem("settings") || "{}"));

speedSlider.value = appSettings.maxSpeed;
invertSideway.checked = appSettings.invertSideway;
invertYaw.checked = appSettings.invertYaw;
invertForward.checked = appSettings.invertForward;
cameraToggle.checked = appSettings.cameraBG;

function saveSettings() {
  localStorage.setItem("settings", JSON.stringify(appSettings));
}

/* ================= SETTINGS EVENTS ================= */
speedSlider.oninput = e => { appSettings.maxSpeed = +e.target.value; saveSettings(); };
invertSideway.onchange = e => { appSettings.invertSideway = e.target.checked; saveSettings(); };
invertYaw.onchange = e => { appSettings.invertYaw = e.target.checked; saveSettings(); };
invertForward.onchange = e => { appSettings.invertForward = e.target.checked; saveSettings(); };
cameraToggle.onchange = e => toggleCamera(e.target.checked);

/* ================= SETTINGS MODAL ================= */
menuBtn.onclick = () => {
  overlay.style.display = "block";
  settingsModal.style.display = "block";
};
closeSettingsBtn.onclick = overlay.onclick = () => {
  overlay.style.display = "none";
  settingsModal.style.display = "none";
};

/* ================= CAMERA ================= */
let cameraStream = null;
async function toggleCamera(on) {
  appSettings.cameraBG = on;
  saveSettings();
  if (on) {
    cameraStream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: "environment" } }, audio: false
    });
    cameraBG.srcObject = cameraStream;
    cameraBG.style.display = "block";
  } else {
    cameraBG.style.display = "none";
    cameraStream?.getTracks().forEach(t => t.stop());
  }
}

/* ================= BLE CONNECT ================= */
function onDisconnected() {
  statusEl.innerHTML = `Disconnected <span class="version-badge">v${APP_VERSION}</span>`;
  statusEl.className = "status-disconnected";
  batteryEl.textContent = "V: --.- V | I: ---.- mA";
  rxChar = null;
  txChar = null;
  isWriting = false;
}

connectBtn.onclick = async () => {
  try {
    device = await navigator.bluetooth.requestDevice({
      filters: [
        { namePrefix: "ANT-BOT" }
      ],
      optionalServices: [SERVICE]
    });

    device.addEventListener('gattserverdisconnected', onDisconnected);

    const server = await device.gatt.connect();
    const service = await server.getPrimaryService(SERVICE);

    rxChar = await service.getCharacteristic(RX);
    txChar = await service.getCharacteristic(TX);

    await txChar.startNotifications();
    txChar.addEventListener("characteristicvaluechanged", onNotify);

    statusEl.innerHTML = `Connected <span class="version-badge">v${APP_VERSION}</span>`;
    statusEl.className = "status-connected";
  } catch (e) {
    onDisconnected();
    console.error(e);
  }
};

/* ================= BLE RX ================= */
function onNotify(e) {
  const data = new TextDecoder().decode(e.target.value);
  for (let idx = 0; idx < data.length; idx++) {
    const c = data[idx];
    if (c === "\n" || c === "\r") {
      if (rxBuffer.trim().length > 0) handleStatus(rxBuffer);
      rxBuffer = "";
    } else {
      rxBuffer += c;
    }
  }
}

/* ================= MOTOR LOOP ================= */
let isWriting = false;

setInterval(async () => {
  if (!rxChar || isWriting) return;

  const activeFwd = rightJoyActive ? forward : leftForward;
  const x = Math.round(Math.min(100, Math.max(-100, sideway * appSettings.maxSpeed * 100)));
  const y = Math.round(Math.min(100, Math.max(-100, activeFwd * appSettings.maxSpeed * 100)));
  const z = Math.round(Math.min(100, Math.max(-100, yaw * appSettings.maxSpeed * 100)));

  const packet = new TextEncoder().encode(`drive ${x},${y},${z}\n`);
  isWriting = true;
  try {
    if (rxChar.writeValueWithoutResponse) {
      await rxChar.writeValueWithoutResponse(packet);
    } else {
      await rxChar.writeValue(packet);
    }
  } catch (err) {
    console.warn("Write dropped/error:", err);
  } finally {
    isWriting = false;
  }
}, 35);

/* ================= STATUS PARSER ================= */
function handleStatus(msg) {
  const v = msg.match(/V=([-\d.]+)/);
  const i = msg.match(/I=([-\d.]+)/);
  if (v && i) {
    batteryEl.textContent =
      `V: ${(+v[1]).toFixed(2)} V | I: ${(+i[1]).toFixed(1)} mA`;
  }
}

/* ================= RELATIVE JOYSTICK ================= */
function setupJoystick(el, onMove, onRelease, onStart) {
  const knob = el.querySelector(".knob");
  const r = el.clientWidth / 2;
  const kr = knob.clientWidth / 2;
  const maxDist = r - kr;

  let active = false, sx = 0, sy = 0;

  function update(dx, dy) {
    const d = Math.min(maxDist, Math.hypot(dx, dy));
    const a = Math.atan2(dy, dx);
    const px = Math.cos(a) * d;
    const py = Math.sin(a) * d;
    knob.style.transform = `translate(${px}px,${py}px) translate(-50%,-50%)`;
    onMove(px / maxDist, py / maxDist);
  }

  el.addEventListener("pointerdown", e => {
    el.setPointerCapture(e.pointerId);
    active = true;
    sx = e.clientX; sy = e.clientY;
    if (onStart) onStart();
    update(0, 0);
  });
  el.addEventListener("pointermove", e => { if (active) update(e.clientX - sx, e.clientY - sy); });
  const end = () => {
    active = false;
    knob.style.transform = "translate(-50%,-50%)";
    onRelease();
  };
  el.addEventListener("pointerup", end);
  el.addEventListener("pointercancel", end);
}

/* ================= FULLSCREEN ================= */
function isFullscreen() {
  return !!(
    document.fullscreenElement ||
    document.webkitFullscreenElement ||
    document.mozFullScreenElement ||
    document.msFullscreenElement ||
    document.body.classList.contains("is-fullscreen")
  );
}

function showToast(msg, duration = 3000) {
  const toast = document.getElementById("toast");
  if (!toast) return;
  toast.textContent = msg;
  toast.classList.add("show");
  clearTimeout(toast._timer);
  toast._timer = setTimeout(() => toast.classList.remove("show"), duration);
}

async function toggleFullscreen() {
  const doc = document.documentElement;
  const isFs = isFullscreen();

  if (!isFs) {
    let entered = false;

    // Standard Fullscreen API (Android Chrome, Edge, etc.)
    if (doc.requestFullscreen) {
      try {
        await doc.requestFullscreen({ navigationUI: "hide" });
        entered = true;
      } catch (err) {
        try {
          await doc.requestFullscreen();
          entered = true;
        } catch (err2) {
          console.warn("doc.requestFullscreen fallback failed:", err2);
        }
      }
    }

    // Body fallback
    if (!entered && document.body.requestFullscreen) {
      try {
        await document.body.requestFullscreen({ navigationUI: "hide" });
        entered = true;
      } catch (err) {
        try {
          await document.body.requestFullscreen();
          entered = true;
        } catch (err2) {}
      }
    }

    // WebKit prefix (iPadOS / Safari)
    if (!entered && doc.webkitRequestFullscreen) {
      try {
        doc.webkitRequestFullscreen();
        entered = true;
      } catch (err) {}
    }
    if (!entered && document.body.webkitRequestFullscreen) {
      try {
        document.body.webkitRequestFullscreen();
        entered = true;
      } catch (err) {}
    }

    // Orientation lock if available
    if (screen.orientation && screen.orientation.lock) {
      screen.orientation.lock("landscape").catch(() => {});
    }

    if (entered) {
      showToast("Fullscreen Active ⛶");
    } else {
      // iOS iPhone fallback where element Fullscreen API is disabled by Apple
      document.body.classList.add("is-fullscreen");
      window.scrollTo(0, 1);
      const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
      if (isIOS) {
        showToast("iOS: Tap Share ⎋ > Add to Home Screen for borderless fullscreen", 4500);
      } else {
        showToast("Fullscreen Mode");
      }
    }
  } else {
    document.body.classList.remove("is-fullscreen");
    try {
      if (document.exitFullscreen) {
        await document.exitFullscreen();
      } else if (document.webkitExitFullscreen) {
        document.webkitExitFullscreen();
      }
    } catch (e) {}
    if (screen.orientation && screen.orientation.unlock) {
      screen.orientation.unlock().catch(() => {});
    }
    showToast("Exited Fullscreen");
  }
  updateFsIcon();
}

let lastFsToggle = 0;
function onFullscreenClick(e) {
  if (e && e.cancelable) e.preventDefault();
  const now = Date.now();
  if (now - lastFsToggle < 350) return;
  lastFsToggle = now;
  toggleFullscreen();
}

fullscreenBtn.addEventListener("click", onFullscreenClick);
fullscreenBtn.addEventListener("touchend", onFullscreenClick);

function updateFsIcon() {
  fullscreenBtn.textContent = isFullscreen() ? "🗗" : "⛶";
}
document.addEventListener("fullscreenchange", updateFsIcon);
document.addEventListener("webkitfullscreenchange", updateFsIcon);

/* ================= INIT ================= */
// Left Joystick: Controls steering (Yaw) + Forward (when Right Joy is not touched)
setupJoystick(
  document.getElementById("joyYaw"),
  (nx, ny) => {
    yaw = appSettings.invertYaw ? -nx : nx;
    leftForward = appSettings.invertForward ? ny : -ny;
  },
  () => {
    yaw = 0;
    leftForward = 0;
  }
);

// Right Joystick: Controls Forward and Sideway (takes precedence when touched)
setupJoystick(
  document.getElementById("joyDrive"),
  (nx, ny) => {
    sideway = appSettings.invertSideway ? -nx : nx;
    forward = appSettings.invertForward ? ny : -ny;
  },
  () => {
    rightJoyActive = false;
    forward = 0;
    sideway = 0;
  },
  () => {
    rightJoyActive = true;
  }
);

if (appSettings.cameraBG) toggleCamera(true);
</script>

</body>
</html>
